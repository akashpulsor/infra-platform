##
## kamailio.cfg — Dalai LLAMA PBX Platform
##
## Kamailio has NO direct DB access. ALL lookups via PBX-Core HTTP.
## PBX-Core exposed via Traefik IngressRoute at http://pbx-core.internal:8080
##
## Call flows:
##   1. Agent REGISTER (WebSocket/UDP) → auth via PBX-Core → usrloc
##   2. Inbound PSTN → PBX-Core authorize → FreeSWITCH (dialplan from PBX-Core)
##   3. Outbound Agent → PBX-Core authorize → FreeSWITCH → PSTN trunk
##   4. Internal Agent→Agent → usrloc lookup → direct routing
##   5. FreeSWITCH→Agent (call delivery) → usrloc lookup → WebSocket
##

## ════════════════════════════════════════════════════════════
## GLOBAL PARAMETERS
## ════════════════════════════════════════════════════════════

#!define PBX_CORE_URL "http://pbx-core.internal:8080"
#!define SIP_DOMAIN "sip.dalaillama.in"
#!define EXTERNAL_IP "YOUR_PUBLIC_IP"
#!define RTPENGINE_SOCK "udp:127.0.0.1:2223"

## Uncomment for debug (very verbose, disable in production)
# debug=4
# log_stderror=yes
debug=2
log_stderror=no
log_facility=LOG_LOCAL0

## Server identity
server_header="Server: DalaiLLAMA-SIP"
user_agent_header="User-Agent: DalaiLLAMA-SIP"

## Process/memory
fork=yes
children=4
tcp_children=4

## Ports
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
listen=ws:0.0.0.0:8080        # WebSocket (plain, behind Traefik TLS)
# listen=wss:0.0.0.0:7443     # WebSocket Secure (if Kamailio terminates TLS)

## DNS
dns=no
rev_dns=no
dns_cache_init=off

## TLS (for SIP TLS and WSS)
#!ifdef WITH_TLS
enable_tls=yes
tls_certificate="/etc/kamailio/tls/server.crt"
tls_private_key="/etc/kamailio/tls/server.key"
#!endif

## ════════════════════════════════════════════════════════════
## MODULE LOADING
## ════════════════════════════════════════════════════════════

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

## Core
loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "path.so"

## Registrar + Location (in-memory — no DB)
loadmodule "registrar.so"
loadmodule "usrloc.so"

## Authentication (digest validation — HA1 from PBX-Core)
loadmodule "auth.so"

## NAT traversal
loadmodule "nathelper.so"

## HTTP client (to call PBX-Core)
loadmodule "http_client.so"

## JSON parsing (to parse PBX-Core responses)
loadmodule "jansson.so"

## WebSocket
loadmodule "websocket.so"

## RTPEngine (media proxy — WebRTC SRTP ↔ RTP)
loadmodule "rtpengine.so"

## TLS
#!ifdef WITH_TLS
loadmodule "tls.so"
#!endif

## JSONRPC (for kamcmd — PBX-Core triggers reloads via this)
loadmodule "jsonrpcs.so"

## Corex (for extra routing helpers)
loadmodule "corex.so"

## ════════════════════════════════════════════════════════════
## MODULE PARAMETERS
## ════════════════════════════════════════════════════════════

## ── tm (transaction management) ──
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)          # 30s INVITE timeout
modparam("tm", "fr_inv_timer", 120000)     # 120s INVITE transaction timeout

## ── rr (record-route) ──
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

## ── registrar ──
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)
modparam("registrar", "default_expires", 300)
modparam("registrar", "gruu_enabled", 0)

## ── usrloc (in-memory, no DB) ──
modparam("usrloc", "db_mode", 0)           # 0 = memory only, no DB
modparam("usrloc", "use_domain", 1)        # multi-tenant: user@domain

## ── auth ──
modparam("auth", "nonce_expire", 300)      # nonce valid for 5 minutes
modparam("auth", "nonce_count", 1)
modparam("auth", "one_time_nonce", 0)      # allow nonce reuse (for re-INVITE)

## ── http_client (PBX-Core connection) ──
modparam("http_client", "httpcon", "pbxcore=>PBX_CORE_URL")
modparam("http_client", "connection_timeout", 3000)  # 3s connect timeout
modparam("http_client", "httpredirect", 0)
modparam("http_client", "keep_connections", 1)       # HTTP keep-alive

## ── nathelper ──
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", 7)
modparam("nathelper", "sipping_from", "sip:keepalive@SIP_DOMAIN")

## ── rtpengine ──
modparam("rtpengine", "rtpengine_sock", RTPENGINE_SOCK)

## ── websocket ──
modparam("websocket", "keepalive_mechanism", 1)      # PING frames
modparam("websocket", "keepalive_timeout", 30)
modparam("websocket", "keepalive_processes", 1)

## ── jsonrpcs (kamcmd interface — PBX-Core calls this for reloads) ──
modparam("jsonrpcs", "transport", 1)       # 1 = HTTP transport
## JSONRPC listens on Kamailio's TCP port, path /jsonrpc

## ════════════════════════════════════════════════════════════
## MAIN REQUEST ROUTE
## ════════════════════════════════════════════════════════════

request_route {
    ## ── Per-request sanity ──
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }

    ## ── Record-route for mid-dialog requests ──
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    ## ── Sequential requests (in-dialog: BYE, re-INVITE, ACK) ──
    if (has_totag()) {
        if (loose_route()) {
            ## NAT handling for in-dialog
            if (is_method("INVITE|UPDATE|ACK")) {
                route(NATDETECT);
                route(RTPENGINE_MANAGE);
            }
            route(RELAY);
            exit;
        }
        ## ACK to 2xx — absorb (stateless)
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
            }
            exit;
        }
        sl_send_reply("404", "Not Found");
        exit;
    }

    ## ── Cancel handling ──
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    ## ── Initial request: check transaction ──
    t_check_trans();

    ## ── OPTIONS keepalive ──
    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    ## ── NAT detection ──
    route(NATDETECT);

    ## ── REGISTER ──
    if (is_method("REGISTER")) {
        route(AUTH_REGISTER);
        exit;
    }

    ## ── INVITE ──
    if (is_method("INVITE")) {
        route(INVITE_HANDLER);
        exit;
    }

    ## ── BYE (out-of-dialog, shouldn't happen often) ──
    if (is_method("BYE")) {
        route(RELAY);
        exit;
    }

    ## ── Default: relay or reject ──
    if (uri==myself) {
        sl_send_reply("404", "Not Found");
    } else {
        sl_send_reply("403", "Forbidden");
    }
    exit;
}


## ════════════════════════════════════════════════════════════
## ROUTE: AUTH_REGISTER — Agent SIP registration
## ════════════════════════════════════════════════════════════

route[AUTH_REGISTER] {
    ## Step 1: Challenge if no credentials
    if (!is_present_hf("Authorization")) {
        auth_challenge("SIP_DOMAIN", "0");
        exit;
    }

    ## Step 2: Extract username + domain from Authorization header
    $var(auth_user) = $au;           # auth username
    $var(auth_domain) = $ar;         # auth realm

    ## If no realm in Authorization, use Request-URI domain
    if ($var(auth_domain) == "" || $var(auth_domain) == $null) {
        $var(auth_domain) = $td;
    }

    ## Step 3: Call PBX-Core to get HA1
    $var(req_body) = '{"username":"' + $var(auth_user) + '","domain":"' + $var(auth_domain) + '"}';

    $var(res) = $null;
    http_client_query("pbxcore/internal/kamailio/auth/digest",
        $var(req_body), "application/json", "$var(res)");

    if ($rc != 200 || $var(res) == "" || $var(res) == $null) {
        xlog("L_WARN", "Auth failed: PBX-Core returned $rc for $var(auth_user)@$var(auth_domain)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    ## Step 4: Extract HA1 from response
    jansson_get("ha1", $var(res), "$avp(ha1)");
    jansson_get("tenant_id", $var(res), "$avp(tenant_id)");

    if ($avp(ha1) == "" || $avp(ha1) == $null) {
        xlog("L_WARN", "Auth failed: no HA1 for $var(auth_user)@$var(auth_domain)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    ## Step 5: Validate digest using the HA1 from PBX-Core
    ## pv_auth_check compares the digest response against HA1
    if (!pv_auth_check("SIP_DOMAIN", "$avp(ha1)", "0")) {
        auth_challenge("SIP_DOMAIN", "0");
        exit;
    }

    ## Step 6: Auth passed — save location
    consume_credentials();

    ## Add Path header for NAT traversal
    if (is_method("REGISTER") && isflagset(FLT_NATS)) {
        add_path_received();
    } else {
        add_path();
    }

    if (!save("location")) {
        sl_send_reply("500", "Server Error");
        exit;
    }

    xlog("L_INFO", "REGISTER OK: $var(auth_user)@$var(auth_domain) [tenant=$avp(tenant_id)] from $si:$sp ($proto)\n");
    exit;
}


## ════════════════════════════════════════════════════════════
## ROUTE: INVITE_HANDLER — All INVITE routing
## ════════════════════════════════════════════════════════════

route[INVITE_HANDLER] {
    ## Determine call direction:
    ## - From registered agent (WebSocket or UDP) → OUTBOUND or INTERNAL
    ## - From FreeSWITCH (call delivery to agent) → FREESWITCH_TO_AGENT
    ## - From external/trunk (PSTN inbound) → INBOUND

    ## Check if sender is a registered agent
    if (is_present_hf("Authorization") || $proto == "ws" || $proto == "wss") {
        ## Agent is calling — authenticate first
        route(AUTH_INVITE);

        ## After auth, decide: internal or outbound?
        ## Check if destination is a registered user
        if (lookup("location")) {
            ## Destination found in usrloc → internal call (agent-to-agent)
            xlog("L_INFO", "INTERNAL CALL: $fU@$fd → $rU@$rd [tenant=$avp(tenant_id)]\n");
            route(RTPENGINE_OFFER);
            route(RELAY);
            exit;
        }

        ## Destination NOT in usrloc → outbound call to PSTN
        route(OUTBOUND);
        exit;
    }

    ## Check if from FreeSWITCH (delivering call to agent)
    if ($si == "FREESWITCH_IP" || $sP == 5080) {
        route(FREESWITCH_TO_AGENT);
        exit;
    }

    ## Otherwise: inbound from PSTN/trunk
    route(INBOUND);
    exit;
}


## ════════════════════════════════════════════════════════════
## ROUTE: AUTH_INVITE — Authenticate agent for outbound/internal calls
## ════════════════════════════════════════════════════════════

route[AUTH_INVITE] {
    ## Same HA1 lookup as REGISTER
    if (!is_present_hf("Authorization")) {
        auth_challenge("SIP_DOMAIN", "0");
        exit;
    }

    $var(auth_user) = $au;
    $var(auth_domain) = $ar;
    if ($var(auth_domain) == "" || $var(auth_domain) == $null) {
        $var(auth_domain) = $fd;
    }

    $var(req_body) = '{"username":"' + $var(auth_user) + '","domain":"' + $var(auth_domain) + '"}';
    $var(res) = $null;
    http_client_query("pbxcore/internal/kamailio/auth/digest",
        $var(req_body), "application/json", "$var(res)");

    if ($rc != 200) {
        sl_send_reply("403", "Forbidden");
        exit;
    }

    jansson_get("ha1", $var(res), "$avp(ha1)");
    jansson_get("tenant_id", $var(res), "$avp(tenant_id)");

    if (!pv_auth_check("SIP_DOMAIN", "$avp(ha1)", "0")) {
        auth_challenge("SIP_DOMAIN", "0");
        exit;
    }

    consume_credentials();
}


## ════════════════════════════════════════════════════════════
## ROUTE: INBOUND — PSTN call arriving at our DID
## ════════════════════════════════════════════════════════════

route[INBOUND] {
    xlog("L_INFO", "INBOUND: DID=$rU caller=$fU domain=$rd callId=$ci\n");

    ## Step 1: Domain check
    $var(res) = $null;
    http_client_query("pbxcore/internal/kamailio/domain/$rd/exists",
        "", "", "$var(res)");

    if ($rc != 200) {
        xlog("L_WARN", "INBOUND: domain $rd not found\n");
        sl_send_reply("404", "Not Found");
        exit;
    }

    ## Step 2: Full authorization + routing
    $var(auth_body) = '{"didNumber":"' + $rU + '","callerNumber":"' + $fU
        + '","callId":"' + $ci + '","domain":"' + $rd + '"}';

    $var(auth_res) = $null;
    http_client_query("pbxcore/internal/kamailio/authorize/inbound",
        $var(auth_body), "application/json", "$var(auth_res)");

    if ($rc != 200) {
        ## Auth denied — extract reason
        jansson_get("code", $var(auth_res), "$avp(deny_code)");
        xlog("L_WARN", "INBOUND DENIED: DID=$rU reason=$avp(deny_code)\n");

        if ($avp(deny_code) == "CHANNEL_LIMIT") {
            sl_send_reply("486", "Busy Here");
        } else {
            sl_send_reply("403", "Forbidden");
        }
        exit;
    }

    ## Step 3: Extract routing info from PBX-Core response
    jansson_get("tenantId", $var(auth_res), "$avp(tenant_id)");
    jansson_get("subscriptionId", $var(auth_res), "$avp(subscription_id)");
    jansson_get("routingTarget", $var(auth_res), "$avp(routing_target)");
    jansson_get("dispatcherSet", $var(auth_res), "$avp(ds_set)");
    jansson_get("productCode", $var(auth_res), "$avp(product_code)");
    jansson_get("aiEnabled", $var(auth_res), "$avp(ai_enabled)");
    jansson_get("recordingEnabled", $var(auth_res), "$avp(recording_enabled)");
    jansson_get("sipDomain", $var(auth_res), "$avp(sip_domain)");
    jansson_get("namespace", $var(auth_res), "$avp(namespace)");

    ## RTPEngine hints
    jansson_get("rtpengine_codecs", $var(auth_res), "$avp(rtp_codecs)");
    jansson_get("rtpengine_recording", $var(auth_res), "$avp(rtp_recording)");
    jansson_get("rtpengine_ai_fork", $var(auth_res), "$avp(rtp_ai_fork)");
    jansson_get("rtpengine_ai_fork_target", $var(auth_res), "$avp(rtp_ai_fork_target)");

    ## Step 4: Add SIP headers for FreeSWITCH
    ## FreeSWITCH reads these to determine dialplan context and features
    append_hf("X-Tenant-ID: $avp(tenant_id)\r\n");
    append_hf("X-Subscription-ID: $avp(subscription_id)\r\n");
    append_hf("X-Product-Code: $avp(product_code)\r\n");
    append_hf("X-Routing-Target: $avp(routing_target)\r\n");
    append_hf("X-AI-Enabled: $avp(ai_enabled)\r\n");
    append_hf("X-Recording: $avp(recording_enabled)\r\n");
    append_hf("X-Namespace: $avp(namespace)\r\n");

    ## Step 5: Get FreeSWITCH destination
    $var(ds_res) = $null;
    http_client_query("pbxcore/internal/kamailio/dispatcher/$avp(ds_set)",
        "", "", "$var(ds_res)");

    if ($rc != 200) {
        xlog("L_ERR", "INBOUND: no dispatcher for set $avp(ds_set)\n");
        sl_send_reply("500", "No Media Server");
        exit;
    }

    ## Extract first destination
    jansson_get("destinations[0].destination", $var(ds_res), "$avp(fs_dest)");

    ## Step 6: RTPEngine — set up media proxy
    route(RTPENGINE_OFFER);

    ## Step 7: Notify PBX-Core of call start
    $var(start_body) = '{"tenantId":"' + $avp(tenant_id)
        + '","subscriptionId":"' + $avp(subscription_id)
        + '","callId":"' + $ci
        + '","direction":"INBOUND"'
        + ',"callerNumber":"' + $fU
        + '","calleeNumber":"' + $rU
        + '","didNumber":"' + $rU
        + '","productCode":"' + $avp(product_code) + '"}';

    http_client_query("pbxcore/internal/kamailio/events/call-start",
        $var(start_body), "application/json", "$var(discard)");

    ## Step 8: Route to FreeSWITCH
    $du = $avp(fs_dest);
    xlog("L_INFO", "INBOUND ROUTING: DID=$rU → FS=$avp(fs_dest) [tenant=$avp(tenant_id) product=$avp(product_code) route=$avp(routing_target)]\n");

    t_on_failure("INBOUND_FAILURE");
    route(RELAY);
    exit;
}


## ════════════════════════════════════════════════════════════
## ROUTE: OUTBOUND — Agent calling external number
## ════════════════════════════════════════════════════════════

route[OUTBOUND] {
    xlog("L_INFO", "OUTBOUND: agent=$fU dest=$rU tenant=$avp(tenant_id)\n");

    ## Step 1: Authorize outbound call via PBX-Core
    $var(out_body) = '{"callerNumber":"' + $fU
        + '","destination":"' + $rU
        + '","tenantId":"' + $avp(tenant_id) + '"}';

    $var(out_res) = $null;
    http_client_query("pbxcore/internal/kamailio/authorize/outbound",
        $var(out_body), "application/json", "$var(out_res)");

    if ($rc != 200) {
        jansson_get("code", $var(out_res), "$avp(deny_code)");
        xlog("L_WARN", "OUTBOUND DENIED: agent=$fU dest=$rU reason=$avp(deny_code)\n");

        if ($avp(deny_code) == "DNC_BLOCKED") {
            sl_send_reply("603", "Declined");
        } else if ($avp(deny_code) == "CHANNEL_LIMIT") {
            sl_send_reply("486", "Busy Here");
        } else if ($avp(deny_code) == "INSUFFICIENT_BALANCE") {
            sl_send_reply("402", "Payment Required");
        } else {
            sl_send_reply("403", "Forbidden");
        }
        exit;
    }

    ## Step 2: Extract response
    jansson_get("subscriptionId", $var(out_res), "$avp(subscription_id)");
    jansson_get("callerIdOverride", $var(out_res), "$avp(caller_id)");
    jansson_get("productCode", $var(out_res), "$avp(product_code)");

    ## Step 3: Add headers for FreeSWITCH
    append_hf("X-Tenant-ID: $avp(tenant_id)\r\n");
    append_hf("X-Subscription-ID: $avp(subscription_id)\r\n");
    append_hf("X-Product-Code: $avp(product_code)\r\n");
    append_hf("X-Direction: OUTBOUND\r\n");
    append_hf("X-Caller-ID: $avp(caller_id)\r\n");

    ## Step 4: Get FreeSWITCH destination (default set 1)
    $var(ds_res) = $null;
    http_client_query("pbxcore/internal/kamailio/dispatcher/1",
        "", "", "$var(ds_res)");

    jansson_get("destinations[0].destination", $var(ds_res), "$avp(fs_dest)");

    ## Step 5: RTPEngine
    route(RTPENGINE_OFFER);

    ## Step 6: Call start event
    $var(start_body) = '{"tenantId":"' + $avp(tenant_id)
        + '","subscriptionId":"' + $avp(subscription_id)
        + '","callId":"' + $ci
        + '","direction":"OUTBOUND"'
        + ',"callerNumber":"' + $fU
        + '","calleeNumber":"' + $rU
        + '","productCode":"' + $avp(product_code) + '"}';

    http_client_query("pbxcore/internal/kamailio/events/call-start",
        $var(start_body), "application/json", "$var(discard)");

    ## Step 7: Route to FreeSWITCH
    $du = $avp(fs_dest);
    xlog("L_INFO", "OUTBOUND ROUTING: agent=$fU → $rU via FS=$avp(fs_dest)\n");

    route(RELAY);
    exit;
}


## ════════════════════════════════════════════════════════════
## ROUTE: FREESWITCH_TO_AGENT — FreeSWITCH delivering call to agent
## ════════════════════════════════════════════════════════════

route[FREESWITCH_TO_AGENT] {
    ## FreeSWITCH bridges a call to agent extension (e.g., 1001@tenant-acme.dalaillama.in)
    ## Kamailio looks up agent's contact in usrloc and routes to their WebSocket

    xlog("L_INFO", "FS→AGENT: dest=$rU@$rd from FreeSWITCH\n");

    ## Lookup agent in usrloc
    if (!lookup("location")) {
        ## Agent not registered — send 480 Temporarily Unavailable
        ## FreeSWITCH will handle fallback (voicemail, queue timeout, etc.)
        xlog("L_WARN", "FS→AGENT: $rU@$rd not registered\n");
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }

    ## RTPEngine — handle WebRTC media conversion (SRTP ↔ RTP)
    route(RTPENGINE_OFFER);

    ## Route to agent's registered contact (WebSocket, UDP, etc.)
    xlog("L_INFO", "FS→AGENT: routing to $rU@$rd contact=$du\n");
    t_on_failure("AGENT_UNAVAILABLE");
    route(RELAY);
    exit;
}


## ════════════════════════════════════════════════════════════
## ROUTE: RTPENGINE — Media proxy management
## ════════════════════════════════════════════════════════════

route[RTPENGINE_OFFER] {
    ## Determine RTPEngine flags based on call scenario
    $var(rtp_flags) = "replace-origin replace-session-connection";

    ## WebRTC client? Add ICE + DTLS-SRTP handling
    if ($proto == "ws" || $proto == "wss") {
        $var(rtp_flags) = $var(rtp_flags) + " ICE=force-relay DTLS=passive SDES-off rtcp-mux-offer";
    }

    ## Recording enabled?
    if ($avp(rtp_recording) == "true") {
        $var(rtp_flags) = $var(rtp_flags) + " record-call=yes";
    }

    rtpengine_offer("$var(rtp_flags)");
}

route[RTPENGINE_MANAGE] {
    $var(rtp_flags) = "replace-origin replace-session-connection";

    if ($proto == "ws" || $proto == "wss") {
        $var(rtp_flags) = $var(rtp_flags) + " ICE=force-relay DTLS=passive SDES-off rtcp-mux-offer";
    }

    rtpengine_manage("$var(rtp_flags)");
}


## ════════════════════════════════════════════════════════════
## ROUTE: NAT DETECTION
## ════════════════════════════════════════════════════════════

#!define FLT_NATS 5

route[NATDETECT] {
    force_rport();
    if (nat_uac_test("19")) {
        setflag(FLT_NATS);
        if (is_first_hop() && is_method("REGISTER")) {
            set_contact_alias();
        }
    }
}

route[NATMANAGE] {
    if (is_request()) {
        if (has_totag()) {
            if (check_route_param("nat=yes")) {
                setbflag(FLT_NATS);
            }
        }
    }
    if (isflagset(FLT_NATS) || isbflagset(FLT_NATS)) {
        if (is_request()) {
            if (!has_totag()) {
                if (t_is_branch_route()) {
                    add_rr_param(";nat=yes");
                }
            }
        }
        if (is_reply()) {
            if (isbflagset(FLT_NATS)) {
                fix_nated_contact();
            }
        }
    }
}


## ════════════════════════════════════════════════════════════
## ROUTE: RELAY — Forward request via transaction
## ════════════════════════════════════════════════════════════

route[RELAY] {
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("branch_route")) {
            t_on_branch("MANAGE_BRANCH");
        }
    }
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE|CANCEL|ACK")) {
        if (!t_is_set("onreply_route")) {
            t_on_reply("MANAGE_REPLY");
        }
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


## ════════════════════════════════════════════════════════════
## BRANCH & REPLY ROUTES
## ════════════════════════════════════════════════════════════

branch_route[MANAGE_BRANCH] {
    route(NATMANAGE);
}

onreply_route[MANAGE_REPLY] {
    if (status=~"[12][0-9][0-9]") {
        route(NATMANAGE);
    }
    ## RTPEngine answer for reply with SDP
    if (has_body("application/sdp") && (status=~"18[0-9]" || status=~"2[0-9][0-9]")) {
        route(RTPENGINE_MANAGE);
    }
}


## ════════════════════════════════════════════════════════════
## FAILURE ROUTES
## ════════════════════════════════════════════════════════════

failure_route[INBOUND_FAILURE] {
    if (t_is_canceled()) exit;
    xlog("L_WARN", "INBOUND FAILURE: callId=$ci status=$T_reply_code\n");
    ## Could implement failover to next dispatcher destination here
}

failure_route[AGENT_UNAVAILABLE] {
    if (t_is_canceled()) exit;
    xlog("L_WARN", "AGENT UNAVAILABLE: $rU@$rd status=$T_reply_code\n");
    ## FreeSWITCH handles retry/voicemail — just log here
}


## ════════════════════════════════════════════════════════════
## BYE HANDLER — Notify PBX-Core of call end
## ════════════════════════════════════════════════════════════

onreply_route {
    ## Catch BYE 200 OK to notify PBX-Core of call end
    if (is_method("BYE") && status == "200") {
        $var(end_body) = '{"tenantId":"' + $avp(tenant_id)
            + '","callId":"' + $ci
            + '","direction":"' + $avp(direction)
            + '","hangupCause":"NORMAL_CLEARING"}';

        http_client_query("pbxcore/internal/kamailio/events/call-end",
            $var(end_body), "application/json", "$var(discard)");
    }
}

## ════════════════════════════════════════════════════════════
## EVENT ROUTE: WebSocket connection management
## ════════════════════════════════════════════════════════════

event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket closed: $si:$sp\n");
}