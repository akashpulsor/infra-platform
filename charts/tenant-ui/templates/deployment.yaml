{{- range $appName, $appConfig := .Values.apps }}
{{- if $appConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $appName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $appName }}
    app.kubernetes.io/part-of: dalaillama
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $appConfig.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $appName }}
  template:
    metadata:
      labels:
        app: {{ $appName }}
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: {{ $appName }}
          image: "{{ $appConfig.image.repository }}:{{ $appConfig.image.tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_BASE_URL
              value: {{ $.Values.sharedEnv.API_BASE_URL | quote }}
            - name: KEYCLOAK_URL
              value: {{ $.Values.sharedEnv.KEYCLOAK_URL | quote }}
            - name: PLATFORM_URL
              value: {{ $.Values.sharedEnv.PLATFORM_URL | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $appConfig.resources | nindent 12 }}
{{- end }}
{{- end }}
