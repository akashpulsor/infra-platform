# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================
global:
  namespace: apps
  infraNamespace: infra
  domain: dalaillama.in
  image:
    registry: akashtripathi
    pullPolicy: IfNotPresent
  gateway:
    enabled: true
    namespace: istio-system
    name: central-gateway

istio:
  enabled: true
# =============================================================================
# INFRASTRUCTURE SETTINGS (Keycloak, etc.)
# =============================================================================
keycloak:
  issuerUrl: https://auth.dalaillama.in/realms/dalai-llama
  jwksUri: https://auth.dalaillama.in/realms/dalai-llama/protocol/openid-connect/certs
  adminUrl: http://keycloak.apps.svc.cluster.local:80
  adminRealm: master
  adminClientId: admin-cli
  adminUsername: admin
  adminSecretName: keycloak-admin-secret
  adminPasswordKey: password
  clientSecretName: keycloak-client-secret
  clientSecretKey: client-secret

infra_secrets:
  postgres:
    name: postgres-secret
    passwordKey: postgres-password
  redis:
    name: backend-redis-secret
    passwordKey: redis-password

  minio:
    name: backend-minio-secret
    rootUserKey: minio-root-user
    rootPasswordKey: minio-root-password

minio:
  buckets:
    recordings: call-recordings
    voicemail: voicemail
    exports: campaign-exports
    knowledge: bot-knowledge
    cdr: cdr-archives


serviceEntries:
  epsilon-greeter:
    hosts:
      - greeter.co.in
    ports:
      - number: 443
        name: https
        protocol: TLS
  didww-api:
    hosts:
      - api.didww.com
    ports:
      - number: 443
        name: https
        protocol: TLS

# =============================================================================
# MICROSERVICES CONFIGURATION
# =============================================================================
services:
  # --- TENANT SERVICE ---
  tenantService:
    enabled: true
    expose: true
    name: tenant-service
    namespace: apps
    health: {} # This prevents the nil pointer error
    apiPath: 
      - /api/v1/tenants
    replicaCount: 1
    image:
      repository: tenant-service
      tag: "3.0.2"
    service:
      port: 8080
      targetPort: 8080
    database:
      name: tenant_db
      username: tenant_user
    # Provisioning & K8s Orchestration
    kubernetes:
      namespace: dalai-llama
      trustCerts: "true"
    provisioning:
      maxRetries: 3
      retryDelaySeconds: 10
      ipWaitTimeoutMinutes: 5
      ipPollIntervalSeconds: 30
      minWalletBalance: 500
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
    autoscaling:
      enabled: false  # Ensure this block exists!
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilization: 50    
    env:
      SPRING_PROFILES_ACTIVE: prod
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_JPA_SHOW_SQL: "false"
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      # Logging
      LOG_LEVEL: "INFO"
      # Health check scheduler
      HEALTH_CHECK_ENABLED: "true"
      HEALTH_CHECK_INTERVAL_SECONDS: "60"
      HEALTH_CHECK_FAILURE_THRESHOLD: "3"
      CORS_ALLOWED_ORIGINS: "https://dalaillama-dev.local:8443,https://dashboard.dalaillama.in,https://platform.dalaillama.in,http://localhost:8081,http://localhost:5177,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://auth.localhost:8081"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_MAX_AGE: "86400"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"

  # --- PRODUCT SERVICE ---
  productService:
    enabled: true
    expose: true
    name: product-service
    namespace: apps
    apiPaths:
      - /api/v1/products
      - /api/v1/did
      - /api/v1/subscriptions

    replicaCount: 1
    health: {} # This prevents the nil pointer error
    image:
      repository: product-service
      tag: "1.0.7"
    service:
      port: 8080
      targetPort: 8080
    database:
      name: product_db
      username: product_user
    # SIP & DIDWW Integrations
    sip:
      domain: "sip.dalaillama.in"
      realm: "dalaillama.in"
    didww:
      apiUrl: "https://api.didww.com/v3"
      syncEnabled: "true"
      syncIntervalMinutes: "60"
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 256Mi
    autoscaling:
      enabled: false  # Ensure this block exists!
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilization: 50      
    env:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_JPA_SHOW_SQL: "false"
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      # Logging
      LOG_LEVEL: "INFO"
      # Health check scheduler
      HEALTH_CHECK_ENABLED: "true"
      HEALTH_CHECK_INTERVAL_SECONDS: "60"
      HEALTH_CHECK_FAILURE_THRESHOLD: "3"
      CORS_ALLOWED_ORIGINS: "https://dalaillama-dev.local:8443,https://dashboard.dalaillama.in,https://platform.dalaillama.in,http://localhost:8081,http://localhost:5177,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://auth.localhost:8081"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_MAX_AGE: "86400"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"


  # --- BILLING SERVICE ---
  billingService:
    enabled: true
    expose: true
    name: billing-service
    namespace: apps
    apiPaths:
      - /api/v1/billing
    replicaCount: 1
    health: {} # This prevents the nil pointer error
    image:
      repository: billing-service
      tag: "1.0.1"
    service:
      port: 8080
      targetPort: 8080
    database:
      name: billing_db
      username: billing_user
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 256Mi

    autoscaling:
      enabled: false  # Ensure this block exists!
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilization: 50  

    env:
      SPRING_PROFILES_ACTIVE: prod
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SHOW_SQL: "false"
      SQL_LOG_LEVEL: "WARN"
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      # Logging
      LOG_LEVEL: "INFO"
      CORS_ALLOWED_ORIGINS: "https://dalaillama-dev.local:8443,https://dashboard.dalaillama.in,https://platform.dalaillama.in,http://localhost:8081,http://localhost:5177,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://auth.localhost:8081"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_MAX_AGE: "86400"
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxMetaspaceSize=128m"
    # Billing settings
    billing:
      gracePeriodDays: 7
      lowBalanceThreshold: 500
      defaultCurrency: INR
    
    # Razorpay
    razorpay:
      enabled: false

  # --- pbxCore SERVICE ---
  pbxCoreService:
    enabled: true
    expose: true
    name: pbx-core
    namespace: apps
    apiPaths:
      - /api/v1/pbx
    replicaCount: 1
    health: {} # This prevents the nil pointer error
    image:
      repository: pbx-core
      tag: "2.0.8"
    service:
      port: 8080
      targetPort: 8080
    database:
      name: pbx_db
      username: pbx_user
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

    autoscaling:
      enabled: false  # Ensure this block exists!
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilization: 50  
    telecom:
      publicIp: ""
      sipDomain: "sip.dalaillama.in"
      turnDomain: "turn.dalaillama.in"
      freeswitchEslHost: ""
      freeswitchEslPort: "8021"

    env:
      SPRING_PROFILES_ACTIVE: prod
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SHOW_SQL: "false"
      SQL_LOG_LEVEL: "WARN"
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      # Logging
      LOG_LEVEL: "INFO"
      CORS_ALLOWED_ORIGINS: "https://dalaillama-dev.local:8443,https://dashboard.dalaillama.in,https://platform.dalaillama.in,http://localhost:8081,http://localhost:5177,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://auth.localhost:8081"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_MAX_AGE: "86400"
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxMetaspaceSize=128m"
      KAMAILIO_JSONRPC_URL: "http://sip.dalaillama.in:5060/jsonrpc"
      SIP_WSS_URL: "wss://sip.dalaillama.in:7443"
      MINIO_PUBLIC_URL: "https://media.dalaillama.in"
      WEBSOCKET_BROKER: "redis"

  # --- pbxCore SERVICE ---
  aiService:
    enabled: true
    expose: true
    name: ai-service
    namespace: apps
    apiPaths:
      - /api/v1/ai
    replicaCount: 1
    health:
      port: 8601
      readinessPath: /ready
      livenessPath: /health
    image:
      repository: ai-service
      tag: "1.0.8"
    service:
      port: 8601
      targetPort: 8601
    database:
      name: ai_db
      username: ai_user
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 256Mi

    autoscaling:
      enabled: false  # Ensure this block exists!
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilization: 50  

    ai:
      debug: "true"
      authEnabled: "true"
      authAllowUnsafeDevTokens: "false"
      defaultSttProvider: "deepgram"
      defaultTtsProvider: "deepgram"
      defaultLlmProvider: "openai"
      googleProjectId: ""
      googleLocation: "global"
      googleCredentialsPath: ""
      openai:
        sttModel: "whisper-1"
        ttsModel: "tts-1"
        ttsVoice: "alloy"
        llmModel: "gpt-4o-mini"
      ollamaBaseUrl: "http://ollama.apps.svc.cluster.local:11434/v1"
      ollamaLlmModel: "gemma2:2b"
      google:
        llmModel: "gemini-2.5-flash-lite"
        geminiLiveLlmModel: "models/gemini-2.5-flash-native-audio-preview-12-2025"
        geminiLiveVoice: "Charon"
        vertexLlmModel: "gemma3-4b-it"
        ttsVoice: "hi-IN-Chirp3-HD-Pulcherrima"
        ttsVoiceMale: "hi-IN-Chirp3-HD-Puck"
        ttsVoiceFemale: "hi-IN-Chirp3-HD-Pulcherrima"
        ttsMode: "chirp"
        geminiTtsModel: "gemini-2.5-flash-tts"
      deepgram:
        sttModel: "nova-2"
        ttsModel: "aura-asteria-en"
      kokoroBaseUrl: "http://kokoro-tts.apps.svc.cluster.local:5006/synthesize"
      kokoro:
        timeoutSeconds: "45"
        sampleRate: "16000"
        voiceMale: "hm_omega"
        voiceFemale: "hf_alpha"
        speed: "1.0"
      indicTtsBaseUrl: "http://indic-tts.apps.svc.cluster.local:5005/synthesize"
      indicTts:
        sampleRate: "16000"
        voice: "female"
        voiceMale: "male"
        voiceFemale: "female"
        emotion: "neutral"
      rvc:
        enabled: "false"
        serverUrl: "http://rvc.apps.svc.cluster.local:8700"
        timeoutMs: "100"
      audio:
        sampleRate: "16000"
        normalize: "true"
        targetLufs: "-16.0"
        highpassHz: "80"
        limiterThreshold: "0.95"
    env: 
      CORS_ALLOWED_ORIGINS: "https://dalaillama-dev.local:8443,https://dashboard.dalaillama.in,https://platform.dalaillama.in,http://localhost:8081,http://localhost:5177,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://auth.localhost:8081"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_MAX_AGE: "86400"
      KAMAILIO_JSONRPC_URL: "http://sip.dalaillama.in:5060/jsonrpc"
      SIP_WSS_URL: "wss://sip.dalaillama.in:7443"
      MINIO_PUBLIC_URL: "https://media.dalaillama.in"
      WEBSOCKET_BROKER: "redis"


# =============================================================================
# SECRETS MAPPING & VALUES
# =============================================================================
secrets:

  didww:
    name: dalai-backend-didww
    apiKeyKey: api-key
    webhookSecretKey: webhook-secret
    values:
      apiKey: ""
      webhookSecret: ""

  redis:
    name: backend-redis-secret
    passwordKey: redis-password
    values:
      password: ""

  minio:
    name: backend-minio-secret
    rootUserKey: minio-root-user
    rootPasswordKey: minio-root-password
    values:
      rootUser: ""
      rootPassword: ""

  pbxCore:
    name: pbx-core-telecom-secret
    freeswitchEslPasswordKey: freeswitch-esl-password
    coturnSecretKey: coturn-secret
    values:
      freeswitchEslPassword: ""
      coturnSecret: ""

  aiService:
    name: ai-service-secrets
    openaiApiKeyKey: openai-api-key
    deepgramApiKeyKey: deepgram-api-key
    googleApiKeyKey: google-api-key
    googleCredentialsJsonKey: google-credentials-json
    googleCredentialsJsonPathKey: google-credentials-json-path
    values:
      openaiApiKey: ""
      deepgramApiKey: ""
      googleApiKey: ""
      googleCredentialsJson: ""

  razorpay:
    name: dalai-backend-razorpay
    keyIdKey: key-id
    keySecretKey: key-secret
    webhookSecretKey: webhook-secret
    values:
      keyId: ""
      keySecret: ""
      webhookSecret: ""
