  # --- AI SERVICE (Python/FastAPI) ---
  aiService:
    enabled: false
    expose: true
    name: ai-service
    namespace: apps
    apiPaths:
      - /api/v1/ai
    replicaCount: 1
    # Recreate strategy required: hostPort 5555 can only be held by one pod at a time.
    # RollingUpdate deadlocks because old pod holds the port → new pod can't schedule.
    strategy:
      type: Recreate
    health:
      port: 8601
      readinessPath: /ready
      livenessPath: /health
    image:
      repository: ai-service
      tag: "1.0.8"
    service:
      port: 8601
      targetPort: 8601
    # RTP UDP port for voice-brain real-time audio.
    # RTPEngine is OUTSIDE the cluster → hostPort bypasses Istio/kube-proxy entirely.
    # RTPEngine sends to udp:<nodeIP>:5555 → goes directly into the container.
    additionalPorts:
      - name: rtp-udp
        port: 5555
        targetPort: 5555
        hostPort: 5555
        protocol: UDP
    database:
      name: ai_db
      username: ai_user
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 256Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilization: 50
    ai:
      debug: "true"
      authEnabled: "true"
      authAllowUnsafeDevTokens: "false"
      avatar:
        allowTestFallback: "false"
        backgroundRemoval:
          command: ""
          modelId: ZhengPeng7/BiRefNet
        captions:
          engine: faster_whisper
          whisperxCommand: ""
        cosyVoice:
          command: ""
          modelDir: ""
          repo: ""
        downloadTimeoutSeconds: "300"
        echoMimic:
          command: ""
          repo: ""
        elevenLabs:
          baseUrl: https://api.elevenlabs.io
          modelId: eleven_v3
          outputFormat: mp3_44100_128
          removeBackgroundNoise: "true"
          voiceCommand: python "scripts/run_elevenlabs_voice_clone.py" --text-file
            "{text_file}" --prompt-wav "{prompt_wav}" --output-audio "{output_audio}"
            --voice-id "{proprietary_voice_id}" --voice-name "{voice_clone_name}"
            --base-url "{elevenlabs_base_url}" --model-id "{elevenlabs_model_id}"
            --timeout "{proprietary_api_timeout_seconds}"
          voiceId: ""
        faceRestoration:
          command: ""
