{{- if .Values.istio.enabled }}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if $serviceConfig.enabled }}
{{- if $serviceConfig.apiPaths }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ $serviceConfig.name }}
  namespace: {{ $serviceConfig.namespace }}
  labels:
    {{- include "dalai-backend.labels" $ | nindent 4 }}
spec:
  gateways:
    - {{ printf "%s/%s" $.Values.global.gateway.namespace $.Values.global.gateway.name }}
  hosts:
    - api.{{ $.Values.global.domain }}
  http:
    {{- range $path := $serviceConfig.apiPaths }}
    - match:
        - uri:
            prefix: {{ $path }}
      corsPolicy:
        allowOrigins:
          - exact: https://dashboard.dalaillama.in
          - exact: https://platform.dalaillama.in
          - prefix: http://localhost
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - X-Requested-With
        allowCredentials: true
        maxAge: 86400s
      retries:
        attempts: 3
        perTryTimeout: 10s
      route:
        - destination:
            host: {{ $serviceConfig.name }}.{{ $serviceConfig.namespace }}.svc.cluster.local
            port:
              number: {{ $serviceConfig.service.port }}
      timeout: 30s
    {{- end }}
{{- end }}
---
# JWT validation — Istio validates tokens when present,
# but does NOT reject requests without a token (that's AuthorizationPolicy's job).
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: {{ $serviceConfig.name }}-jwt
  namespace: {{ $serviceConfig.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ $serviceConfig.name }}
  jwtRules:
    - issuer: {{ $.Values.keycloak.issuerUrl | quote }}
      jwksUri: {{ $.Values.keycloak.jwksUri | quote }}
      forwardOriginalToken: true
---
# Allow CORS preflight (OPTIONS) requests without JWT
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $serviceConfig.name }}-allow-options
  namespace: {{ $serviceConfig.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ $serviceConfig.name }}
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["OPTIONS"]
---
# Authorization: require JWT on all paths EXCEPT /api/v1/public/*
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $serviceConfig.name }}-require-jwt
  namespace: {{ $serviceConfig.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ $serviceConfig.name }}
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            ports: ["{{ $serviceConfig.service.port }}"]
            notPaths: ["/api/v1/public/*", "/actuator/health"]
{{- end }}
{{- end }}
{{- end }}