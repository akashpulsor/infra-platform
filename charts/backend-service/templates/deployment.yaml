{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if $serviceConfig.enabled }}
{{- $health := $serviceConfig.health | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceConfig.name }}
  namespace: {{ $serviceConfig.namespace }}
  labels:
    {{- include "dalai-backend.labels" $ | nindent 4 }}
    app: {{ $serviceConfig.name }}
spec:
  replicas: {{ $serviceConfig.replicaCount }}
  {{- if $serviceConfig.strategy }}
  strategy:
    type: {{ $serviceConfig.strategy.type }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $serviceConfig.name }}
  template:
    metadata:
      labels:
        app: {{ $serviceConfig.name }}
        app.kubernetes.io/part-of: dalai-llama-backend
        sidecar.istio.io/inject: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $serviceConfig.service.targetPort }}"
        prometheus.io/path: "/actuator/prometheus"
        {{- if $serviceConfig.database }}
        checksum/db-secret: {{ printf "%s:%s" $serviceConfig.database.username ($serviceConfig.database.password | default "") | sha256sum }}
        {{- end }}
        {{- if eq $serviceName "tenantService" }}
        checksum/tenant-credentials-secret: {{ printf "%s:%s" $.Values.secrets.tenantServiceCredentials.name (required "secrets.tenantServiceCredentials.values.encryptionKey is required. Generate once with: openssl rand -base64 32" $.Values.secrets.tenantServiceCredentials.values.encryptionKey) | sha256sum }}
        {{- end }}
        {{- if or (eq $serviceName "creatorService") (eq $serviceName "aiService") }}
        checksum/creator-ai-secret: {{ printf "%s" (toJson $.Values.secrets.aiService) | sha256sum }}
        {{- end }}
        {{- if eq $serviceName "creatorService" }}
        checksum/creator-reddit-secret: {{ printf "%s:%s:%s:%s:%s" $.Values.secrets.reddit.name ($.Values.secrets.reddit.values.clientId | default "") ($.Values.secrets.reddit.values.clientSecret | default "") $.Values.secrets.reddit.clientIdKey $.Values.secrets.reddit.clientSecretKey | sha256sum }}
        {{- end }}
        {{- if eq $serviceName "billingService" }}
        checksum/razorpay-secret: {{ printf "%s:%s:%s:%s:%s:%s:%s" $.Values.secrets.razorpay.name ($.Values.secrets.razorpay.values.keyId | default "") ($.Values.secrets.razorpay.values.keySecret | default "") ($.Values.secrets.razorpay.values.webhookSecret | default "") $.Values.secrets.razorpay.keyIdKey $.Values.secrets.razorpay.keySecretKey $.Values.secrets.razorpay.webhookSecretKey | sha256sum }}
        {{- end }}
        {{- if $serviceConfig.additionalPorts }}
        traffic.sidecar.istio.io/excludeInboundPorts: "{{ range $i, $p := $serviceConfig.additionalPorts }}{{ if $i }},{{ end }}{{ $p.targetPort }}{{ end }}"
        {{- end }}
    spec:
      {{- if $serviceConfig.terminationGracePeriodSeconds }}
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (application.yml) with margin, or
      # Kubernetes SIGKILLs an in-flight request before Spring's own graceful drain finishes.
      terminationGracePeriodSeconds: {{ $serviceConfig.terminationGracePeriodSeconds }}
      {{- end }}
      serviceAccountName: {{ $serviceConfig.name }}
      {{- if $serviceConfig.hostAliases }}
      hostAliases:
        {{- toYaml $serviceConfig.hostAliases | nindent 8 }}
      {{- end }}
      {{- if $serviceConfig.securityContext }}
      securityContext:
        {{- toYaml $serviceConfig.securityContext | nindent 8 }}
      {{- end }}      
      containers:
        - name: {{ $serviceConfig.name }}
          image: "{{ $serviceConfig.image.registry | default $.Values.global.image.registry }}/{{ $serviceConfig.image.repository }}:{{ $serviceConfig.image.tag }}"
          imagePullPolicy: {{ $serviceConfig.image.pullPolicy | default $.Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ $serviceConfig.service.targetPort }}
              name: http
            {{- range $serviceConfig.additionalPorts }}
            - containerPort: {{ .targetPort }}
              name: {{ .name }}
              protocol: {{ .protocol | default "TCP" }}
              {{- if .hostPort }}
              hostPort: {{ .hostPort }}
              {{- end }}
            {{- end }}
          env:
            # ── DB config (all services) ──
            - name: DB_NAME
              value: {{ $serviceConfig.database.name }}
            - name: DB_USERNAME
              value: {{ $serviceConfig.database.username }}
            {{- include "dalai-backend.db-envs" (dict "root" $ "serviceConfig" $serviceConfig) | nindent 12 }}

            # ── Shared by ALL services ──
            {{- include "dalai-backend.redis-envs" $ | nindent 12 }}
            {{- include "dalai-backend.auth-envs" $ | nindent 12 }}
            {{- include "dalai-backend.kafka-envs" $ | nindent 12 }}
            {{- include "dalai-backend.keycloak-client-envs" $ | nindent 12 }}
            {{- include "dalai-backend.minio-envs" $ | nindent 12 }}
            {{- include "dalai-backend.service-urls" $ | nindent 12 }}

            {{- if ne $serviceName "aiService" }}
            # ── Spring-specific config (not needed for Python) ──
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.{{ $.Values.global.infraNamespace }}.svc.cluster.local:5432/{{ $serviceConfig.database.name }}?sslmode=disable"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $serviceConfig.database.username | quote }}
            {{- end }}

            # ── Service-specific integrations ──
            {{- if eq $serviceName "aiService" }}
            {{- include "dalai-backend.ai-service-integrations" $ | nindent 12 }}
            {{- end }}
            {{- if eq $serviceName "tenantService" }}
            {{- include "dalai-backend.keycloak-admin-envs" $ | nindent 12 }}
            {{- include "dalai-backend.provisioning-envs" $ | nindent 12 }}
            {{- include "dalai-backend.tenant-credential-envs" $ | nindent 12 }}
            {{- end }}
            {{- if eq $serviceName "productService" }}
            {{- include "dalai-backend.product-integrations" $ | nindent 12 }}
            {{- end }}
            {{- if eq $serviceName "billingService" }}
            {{- include "dalai-backend.billing-integrations" $ | nindent 12 }}
            {{- end }}
            {{- if eq $serviceName "creatorService" }}
            {{- include "dalai-backend.creator-ai-integrations" $ | nindent 12 }}
            {{- end }}
            {{- if eq $serviceName "llmGateway" }}
            {{- include "dalai-backend.llm-gateway-integrations" $ | nindent 12 }}
            {{- end }}
            {{- if eq $serviceName "pbxCoreService" }}
            {{- include "dalai-backend.pbx-core-integrations" $ | nindent 12 }}
            {{- end }}

            # ── Global ──
            - name: PUBLIC_DOMAIN
              value: "api.{{ $.Values.global.domain }}"

            # ── Service-specific custom overrides from values.yaml ──
            {{- range $key, $value := $serviceConfig.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          {{- if $serviceConfig.preStopSleepSeconds }}
          lifecycle:
            preStop:
              # Gives the Service/Istio endpoint removal time to propagate before this pod stops
              # accepting connections -- without it, in-flight rolling restarts can route a few
              # new requests to a pod that's already draining, which then hard-fail instead of
              # landing on a healthy replica. Standard k8s zero-downtime pattern.
              exec:
                command: ["sh", "-c", "sleep {{ $serviceConfig.preStopSleepSeconds }}"]
          {{- end }}
          {{- if $health.startupPath }}
          startupProbe:
            httpGet:
              path: {{ $health.startupPath }}
              port: {{ $health.port | default $serviceConfig.service.targetPort }}
            initialDelaySeconds: {{ $health.startupInitialDelaySeconds | default 20 }}
            periodSeconds: {{ $health.startupPeriodSeconds | default 10 }}
            timeoutSeconds: {{ $health.startupTimeoutSeconds | default 5 }}
            failureThreshold: {{ $health.startupFailureThreshold | default 36 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $health.livenessPath | default $health.path | default "/actuator/health" }}
              port: {{ $health.port | default $serviceConfig.service.targetPort }}
            initialDelaySeconds: {{ $health.livenessInitialDelaySeconds | default 90 }}
            periodSeconds: {{ $health.livenessPeriodSeconds | default 10 }}
            timeoutSeconds: {{ $health.livenessTimeoutSeconds | default 5 }}
            failureThreshold: {{ $health.livenessFailureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ $health.readinessPath | default $health.path | default "/actuator/health" }}
              port: {{ $health.port | default $serviceConfig.service.targetPort }}
            initialDelaySeconds: {{ $health.readinessInitialDelaySeconds | default 60 }}
            periodSeconds: {{ $health.readinessPeriodSeconds | default 5 }}
            timeoutSeconds: {{ $health.readinessTimeoutSeconds | default 5 }}
            failureThreshold: {{ $health.readinessFailureThreshold | default 3 }}
          resources:
            {{- toYaml $serviceConfig.resources | nindent 12 }}
{{- end }}
{{- end }}
