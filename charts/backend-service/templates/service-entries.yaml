# Add this as a new template file: templates/service-entries.yaml
{{- if .Values.istio.enabled }}
{{- if .Values.serviceEntries }}
{{- range $name, $entry := .Values.serviceEntries }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "dalai-backend.labels" $ | nindent 4 }}
spec:
  hosts:
    {{- range $entry.hosts }}
    - {{ . | quote }}
    {{- end }}
  ports:
    {{- range $entry.ports }}
    - number: {{ .number }}
      name: {{ .name }}
      protocol: {{ .protocol }}
    {{- end }}
  resolution: {{ $entry.resolution | default "DNS" }}
  location: MESH_EXTERNAL
{{- end }}
{{- end }}
{{- end }}
