# =============================================================================
# oauth2-proxy client secret bootstrap.
#
# Same pattern keycloak-client-secret-init uses: pre-create the secret with a
# strong random placeholder so the keycloak-bootstrap Job's OPS_CLIENT_SECRET_DESIRED
# has something to read. On first apply Helm's randAlphaNum picks a fresh value;
# the resource-policy: keep annotation stops subsequent helm upgrades from
# clobbering it, so the value stays stable across releases (rotating it means
# deleting the secret manually, letting the next helm upgrade re-generate, and
# re-running the keycloak-bootstrap Job to push the new value into Keycloak).
#
# oauth2-proxy (deployed by install-observability.sh) reads the same key from
# the same secret; if you change the namespace here, update
# install-observability.sh's helm values in lockstep.
# =============================================================================
{{- if not (lookup "v1" "Secret" .Values.global.namespace "oauth2-proxy-secret") }}
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    app: oauth2-proxy
    managed-by: backend-service-bootstrap
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  client-secret: {{ randAlphaNum 48 | quote }}
{{- end }}
