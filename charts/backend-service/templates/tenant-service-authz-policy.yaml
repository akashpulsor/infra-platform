{{- $tenant := .Values.services.tenantService }}
{{- if and .Values.istio.enabled $tenant.enabled }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $tenant.name }}-allow-api
  namespace: {{ $tenant.namespace }}
  labels:
    {{- include "dalai-backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ $tenant.name }}
  action: ALLOW
  rules:
    - to:
{{- range $path := $tenant.apiPaths }}
        - operation:
            paths:
              - {{ $path }}
{{- if not (hasSuffix "*" $path) }}
              - {{ printf "%s/*" $path }}
{{- end }}
{{- end }}
{{- range $path := $tenant.internalApiPaths }}
        - operation:
            paths:
              - {{ $path }}
{{- if not (hasSuffix "*" $path) }}
              - {{ printf "%s/*" $path }}
{{- end }}
{{- end }}
{{- end }}
