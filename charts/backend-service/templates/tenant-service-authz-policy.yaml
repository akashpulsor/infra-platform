{{- if .Values.istio.enabled }}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if and $serviceConfig.enabled $serviceConfig.apiPaths }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $serviceConfig.name }}-allow-api
  namespace: {{ $serviceConfig.namespace }}
  labels:
    {{- include "dalai-backend.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ $serviceConfig.name }}
  action: ALLOW
  rules:
    # Allow health/actuator probes
    - to:
        - operation:
            paths: ["/actuator*"]
    # Allow ALL internal service-to-service calls (prefix match)
    - to:
        - operation:
            paths: ["/api/v1/internal*"]
    # Allow public paths
    - to:
        - operation:
            paths: ["/api/v1/public*"]
    # Allow webhook paths
    - to:
        - operation:
            paths: ["/api/v1/webhooks*"]
    # Allow service-specific API paths
{{- range $pathEntry := $serviceConfig.apiPaths }}
    {{- $path := $pathEntry }}
    {{- if kindIs "map" $pathEntry }}
    {{- $path = $pathEntry.path }}
    {{- end }}
    - to:
        - operation:
            paths: ["{{ $path }}", "{{ $path }}/*"]
{{- end }}
    # Allow service-specific internal paths
{{- if $serviceConfig.internalApiPaths }}
{{- range $path := $serviceConfig.internalApiPaths }}
    - to:
        - operation:
            paths: ["{{ $path }}", "{{ $path }}/*"]
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
