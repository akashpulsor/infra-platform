{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: creative-worker-ui
spec:
  hosts:
    {{- range .Values.istio.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    - {{ .Values.istio.gatewayName }}
  http:
    - match:
        - uri:
            prefix: {{ .Values.istio.pathPrefix }}
      rewrite:
        uri: /
      route:
        - destination:
            host: creative-worker-ui
            port:
              number: {{ .Values.service.port }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: creative-worker-ui-public
spec:
  selector:
    matchLabels:
      app: creative-worker-ui
  action: ALLOW
  rules:
    - {}
{{- end }}
