# Browser telemetry receiver for creator-ui (templates/alloy-faro.yaml): ConfigMap + Deployment +
# Service in istio-system. Its CORS list must include every SPA origin that posts to it.
alloyFaro:
  enabled: true

# The Loki datasource ConfigMap (templates/grafana.yaml). Grafana itself, and its grafana.ini and
# datasources, are the grafana release (charts/third-party/grafana/values.yaml).
grafana:
  enabled: true

# Jaeger all-in-one (templates/jaeger.yaml), Istio's addon manifest.
jaeger:
  enabled: true

# Grafana's dashboard ConfigMaps (templates/dashboards.yaml, JSON in files/dashboards/).
dashboards:
  enabled: true
