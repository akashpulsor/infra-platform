{{- if .Values.dashboards.enabled }}
# Grafana's dashboards, mounted by the grafana release (dashboardsConfigMaps in
# charts/third-party/grafana/values.yaml). Istio's own dashboards plus ours (spring-boot-jvm, from the
# backend services' /actuator/prometheus metrics). Add a dashboard by dropping its JSON into
# files/dashboards/<folder>/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-grafana-dashboards
  namespace: istio-system
data:
{{ (.Files.Glob "files/dashboards/istio/*.json").AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-services-grafana-dashboards
  namespace: istio-system
data:
{{ (.Files.Glob "files/dashboards/istio-services/*.json").AsConfig | indent 2 }}
---
# This platform's own dashboards (Platform Overview, Service Logs), generated from live metric and
# log labels -- see the "Dalai Platform" provider in charts/third-party/grafana/values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-grafana-dashboards
  namespace: istio-system
data:
{{ (.Files.Glob "files/dashboards/platform/*.json").AsConfig | indent 2 }}
{{- end }}
