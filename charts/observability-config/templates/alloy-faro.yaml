{{- if .Values.alloyFaro.enabled }}
# Rendered by Helm since it moved out of manifests/ -- release.sh upgrades this chart on the box
# whenever its directory changes in a pull, so a change ships with the release that made it.
# Alloy Faro receiver config -- browser-side telemetry from creator-ui (RUM,
# JS errors, console logs, traces) that lands in Loki and Jaeger.
#
# CORS: cors_allowed_origins must list every origin that will POST to the
# receiver. The browser sees the receiver at monitor.dalaillama.in/faro/collect;
# creator.dalaillama.in and ops.dalaillama.in are the two SPAs that call it
# today. Missing an origin here shows up in the browser console as
# "blocked by CORS policy: No 'Access-Control-Allow-Origin' header".
#
# Kept in a ConfigMap so re-applying does not require a Helm chart rebuild.
# Re-apply + kubectl -n istio-system rollout restart deploy/alloy-faro to pick
# up changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-faro-receiver-config
  namespace: istio-system
data:
  config.alloy: |
    faro.receiver "default" {
      server {
        listen_address       = "0.0.0.0"
        listen_port           = 12347
        cors_allowed_origins  = [
          "https://creator.dalaillama.in",
          "https://ops.dalaillama.in",
          "https://dalaillama.in",
        ]
      }
      output {
        logs   = [loki.write.faro.receiver]
        traces = [otelcol.exporter.otlp.jaeger.input]
      }
    }
    loki.write "faro" {
      endpoint {
        url = "http://loki.istio-system.svc.cluster.local:3100/loki/api/v1/push"
      }
      external_labels = { app = "creator-ui-browser" }
    }
    otelcol.exporter.otlp "jaeger" {
      client {
        endpoint = "jaeger-collector.istio-system.svc.cluster.local:4317"
        tls { insecure = true }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-faro
  namespace: istio-system
  labels:
    app: alloy-faro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy-faro
  template:
    metadata:
      labels:
        app: alloy-faro
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          # `alloy run [<FLAG>...] <PATH_NAME>` -- flags must precede the
          # positional config path argument.
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          ports:
            - name: faro-http
              containerPort: 12347
            - name: alloy-ui
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: alloy-faro-receiver-config
---
apiVersion: v1
kind: Service
metadata:
  name: alloy-faro
  namespace: istio-system
  labels:
    app: alloy-faro
spec:
  selector:
    app: alloy-faro
  ports:
    - name: faro-http
      port: 12347
      targetPort: 12347
{{- end }}
