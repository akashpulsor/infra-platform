{{- if .Values.clusterIssuer.create }}
# The Let's Encrypt issuer every Certificate in this chart (and the ops ones) names. Its Cloudflare
# API token stays a bootstrap-created Secret (cloudflare-api-token-secret in cert-manager) -- the
# token must never be a chart value.
# Rendered by Helm since it moved out of manifests/ -- release.sh upgrades this chart on the box
# whenever its directory changes in a pull, so a change ships with the release that made it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: {{ .Values.clusterIssuer.dns01.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - selector:
          dnsZones:
            - {{ .Values.clusterIssuer.dns01.zone | quote }}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
{{- end }}
