{{- if .Values.istio.enabled }}
{{- $gatewayRef := .Values.istio.gatewayRef | default (printf "%s/%s" .Values.istio.namespace .Values.istio.gatewayName) -}}
{{- $services := .Values.ingress.services | default dict -}}
{{- range $name := list "minio-api" "minio-console" "monitor" }}
{{- $svc := index $services $name -}}
{{- if and $svc $svc.enabled $svc.host $svc.serviceName $svc.servicePort }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ printf "%s-virtualservice" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Values.istio.namespace | default $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name | quote }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: {{ printf "%s-routing" $name | quote }}
spec:
  hosts:
    - {{ $svc.host | quote }}
  gateways:
    - {{ $gatewayRef | quote }}
  http:
  {{- if $svc.paths }}
  {{- range $path := $svc.paths }}
    - match:
        - uri:
            prefix: {{ $path.path | default "/" | quote }}
      {{- if $path.rewriteRegex }}
      rewrite:
        uriRegexRewrite:
          match: {{ $path.rewriteRegex.match | quote }}
          rewrite: {{ $path.rewriteRegex.rewrite | quote }}
      {{- end }}
      route:
        - destination:
            host: {{ printf "%s.%s.svc.cluster.local" ($path.serviceName | default $svc.serviceName) ($svc.namespace | default $.Release.Namespace) | quote }}
            port:
              number: {{ $path.servicePort | default $svc.servicePort }}
  {{- end }}
  {{- else }}
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: {{ printf "%s.%s.svc.cluster.local" $svc.serviceName ($svc.namespace | default $.Release.Namespace) | quote }}
            port:
              number: {{ $svc.servicePort }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
