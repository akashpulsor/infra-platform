{{- if and .Values.certificates.wildcard.enabled .Values.istio.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificates.wildcard.secretName }}
  namespace: {{ .Values.istio.namespace }}
spec:
  secretName: {{ .Values.certificates.wildcard.secretName }}
  issuerRef:
    name: {{ .Values.clusterIssuer.dns01.name }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.certificates.wildcard.dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
