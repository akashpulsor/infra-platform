{{- if .Values.ingress.enabled }}

{{- range $name, $svc := .Values.ingress.services }}
{{- if $svc.enabled }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-ingress
  namespace: {{ $svc.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ $.Values.ingress.className }}
    {{- if $.Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer | quote }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $svc.host }}
      secretName: {{ $svc.tlsSecretName | default (printf "%s-tls" ($svc.host | replace "." "-")) }}
  {{- end }}
  rules:
  - host: {{ $svc.host }}
    http:
      paths:
      {{- range $path := $svc.paths }}
      - path: {{ $path.path }}
        pathType: {{ default "Prefix" $path.pathType }}
        backend:
          service:
            name: {{ $path.serviceName | default $svc.serviceName }}
            port:
              number: {{ $path.servicePort | default $svc.servicePort }}
      {{- end }}

{{- end }}
{{- end }}

{{- end }}
