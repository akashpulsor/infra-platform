ingress:
  enabled: false
  className: traefik
  annotations: {}
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

  services:

    keycloak:
      enabled: true
      namespace: apps
      host: auth.dalaillama.in
      serviceName: keycloak
      servicePort: 80
      tlsSecretName: auth-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    tenant:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: tenant-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/tenants
          pathType: Prefix

    billing:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: billing-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/billing
          pathType: Prefix

    product:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: product-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/products
          pathType: Prefix

    pbx:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: pbx-core
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/pbx
          pathType: Prefix

    ai:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: ai-service
      servicePort: 8601
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/ai
          pathType: Prefix

    minio-api:
      enabled: true
      namespace: infra
      host: media.dalaillama.in
      serviceName: minio
      servicePort: 9000
      tlsSecretName: media-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    minio-console:
      enabled: true
      namespace: infra
      host: console.dalaillama.in
      serviceName: minio
      servicePort: 9001
      tlsSecretName: console-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix      
istio:
  enabled: true
  namespace: istio-system
  gatewayName: central-gateway
  gatewayRef: istio-system/central-gateway
  hosts:
    # Wildcard covers all tenant subdomains: admin-acme, agent-acme, etc.
    - "*.dalaillama.in"
    # Explicit hosts kept for clarity (also matched by wildcard)
    - auth.dalaillama.in
    - api.dalaillama.in
    - platform.dalaillama.in
    - dashboard.dalaillama.in
    - creator.dalaillama.in
    - media.dalaillama.in
    - console.dalaillama.in
  tls:
    enabled: true
    httpsRedirect: true
    clusterIssuer: letsencrypt-prod-dns
    certificates:
      # Individual certs — Istio picks most specific SNI match first
      - secretName: auth-dalaillama-in-tls
        hosts:
          - auth.dalaillama.in
      - secretName: api-dalaillama-in-tls
        hosts:
          - api.dalaillama.in
      - secretName: platform-dalaillama-in-tls
        hosts:
          - platform.dalaillama.in
      - secretName: dashboard-dalaillama-in-tls
        hosts:
          - dashboard.dalaillama.in
      - secretName: media-dalaillama-in-tls
        hosts:
          - media.dalaillama.in
      - secretName: console-dalaillama-in-tls
        hosts:
          - console.dalaillama.in

# ── Wildcard certificate for *.dalaillama.in ──────────────────────
# Covers all per-tenant subdomains (agent-acme-xxx, admin-acme-xxx, etc.)
# Requires DNS-01 challenge — HTTP-01 cannot validate wildcards.
certificates:
  wildcard:
    enabled: true
    secretName: wildcard-dalaillama-in-tls
    dnsNames:
      - "*.dalaillama.in"
      - dalaillama.in

# ── DNS-01 ClusterIssuer (Cloudflare) ─────────────────────────────
# Used by ALL Certificate resources (wildcard + individual).
clusterIssuer:
  dns01:
    enabled: true
    name: letsencrypt-prod-dns
    email: admin@dalaillama.in
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecret: letsencrypt-prod-dns
    cloudflareTokenSecret: cloudflare-api-token-secret
    cloudflareTokenKey: api-token
    # Actual token value — leave empty here, override via values-secret.yaml
    cloudflareApiToken: ""
