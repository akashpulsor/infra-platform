ingress:
  enabled: false
  className: traefik
  annotations: {}
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

  services:

    keycloak:
      enabled: true
      namespace: apps
      host: auth.dalaillama.in
      serviceName: keycloak
      servicePort: 80
      tlsSecretName: auth-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    tenant:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: tenant-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/tenants
          pathType: Prefix

    billing:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: billing-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/billing
          pathType: Prefix

    product:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: product-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/products
          pathType: Prefix

    pbx:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: pbx-core
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/pbx
          pathType: Prefix

    ai:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: ai-service
      servicePort: 8601
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/ai
          pathType: Prefix

    minio-api:
      enabled: true
      namespace: infra
      host: media.dalaillama.in
      serviceName: minio
      servicePort: 9000
      tlsSecretName: media-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    minio-console:
      enabled: true
      namespace: infra
      host: console.dalaillama.in
      serviceName: minio
      servicePort: 9001
      tlsSecretName: console-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    monitor:
      # Kiali's UI, at a deliberately generic hostname/cert name rather than
      # "kiali.dalaillama.in" -- the public TLS cert's SAN is visible in
      # public Certificate Transparency logs regardless of auth, so it
      # shouldn't broadcast which specific tool is running.
      # Password-protected via Kiali's own "login" auth strategy (see
      # bootstrap-cloud.sh's install_observability/ensure_kiali_login_auth) --
      # not just network obscurity. Only created when INSTALL_OBSERVABILITY=true
      # actually deploys the kiali Service into istio-system.
      enabled: true
      namespace: istio-system
      host: monitor.dalaillama.in
      serviceName: kiali
      servicePort: 20001
      tlsSecretName: monitor-dalaillama-in-tls

      paths:
        # Grafana Faro (browser RUM) ingestion, unauthenticated by necessity
        # (a browser can't do an interactive login before sending telemetry).
        # Must come before the "/" catch-all below -- Istio matches http
        # routes in listed order, first match wins. Alloy's faro.receiver
        # hardcodes its listen path to "/collect" (not configurable), so the
        # "/faro" prefix is stripped via rewrite before forwarding.
        - path: /faro
          pathType: Prefix
          serviceName: alloy-faro
          servicePort: 12347
          # Istio's admission webhook treats rewrite.uri: "" as unset (can't
          # tell empty string from absent), rejecting it with "rewrite must
          # specify at least one of URI, UriRegexRewrite, or authority" --
          # uriRegexRewrite doesn't have that ambiguity since its presence as
          # a message is what's checked, not its inner string's emptiness.
          stripPrefixRegex: "^/faro"
        - path: /
          pathType: Prefix
istio:
  enabled: true
  namespace: istio-system
  gatewayName: central-gateway
  gatewayRef: istio-system/central-gateway
  hosts:
    # Wildcard covers all tenant subdomains: admin-acme, agent-acme, etc.
    - "*.dalaillama.in"
    # Explicit hosts kept for clarity (also matched by wildcard)
    - auth.dalaillama.in
    - api.dalaillama.in
    - platform.dalaillama.in
    - dashboard.dalaillama.in
    - media.dalaillama.in
    - console.dalaillama.in
    - monitor.dalaillama.in
  tls:
    enabled: true
    httpsRedirect: true
    clusterIssuer: letsencrypt-prod
    certificates:
      # Wildcard cert — covers ALL *.dalaillama.in tenant subdomains
      # Requires DNS-01 challenge (Let's Encrypt doesn't do HTTP-01 for wildcards)
      - secretName: wildcard-dalaillama-in-tls
        hosts:
          - "*.dalaillama.in"
          - dalaillama.in
      # Individual certs kept as fallback (Istio picks most specific match)
      - secretName: auth-dalaillama-in-tls
        hosts:
          - auth.dalaillama.in
      - secretName: api-dalaillama-in-tls
        hosts:
          - api.dalaillama.in
      - secretName: platform-dalaillama-in-tls
        hosts:
          - platform.dalaillama.in
      - secretName: dashboard-dalaillama-in-tls
        hosts:
          - dashboard.dalaillama.in
      - secretName: media-dalaillama-in-tls
        hosts:
          - media.dalaillama.in
      - secretName: console-dalaillama-in-tls
        hosts:
          - console.dalaillama.in
      - secretName: monitor-dalaillama-in-tls
        hosts:
          - monitor.dalaillama.in
