ingress:
  enabled: false
  className: traefik
  annotations: {}
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

  services:

    keycloak:
      enabled: true
      namespace: apps
      host: auth.dalaillama.in
      serviceName: keycloak
      servicePort: 80
      tlsSecretName: auth-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    tenant:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: tenant-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/tenants
          pathType: Prefix

    billing:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: billing-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/billing
          pathType: Prefix

    product:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: product-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/products
          pathType: Prefix

    pbx:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: pbx-core
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/pbx
          pathType: Prefix

    ai:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: ai-service
      servicePort: 8601
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/ai
          pathType: Prefix

    minio-api:
      enabled: true
      namespace: infra
      host: media.dalaillama.in
      serviceName: minio
      servicePort: 9000
      tlsSecretName: media-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    minio-console:
      enabled: true
      namespace: infra
      host: console.dalaillama.in
      serviceName: minio
      servicePort: 9001
      tlsSecretName: console-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    monitor:
      # Public on purpose, so ONLY the Faro ingestion path is routed here -- any other path has no
      # route and 404s. This host used to serve Kiali at "/", but Kiali runs with auth.strategy
      # anonymous (Kiali 2.x has no password login) and this host is not behind the ops
      # oauth2-proxy gate, so the whole mesh map was readable by anyone. Kiali is served only at
      # kiali.dalaillama.in, which is gated (gateway templates/ops-tools.yaml + ops-auth.yaml).
      enabled: true
      namespace: istio-system
      host: monitor.dalaillama.in
      serviceName: alloy-faro
      servicePort: 12347
      tlsSecretName: monitor-dalaillama-in-tls

      paths:
        # Grafana Faro (browser RUM) ingestion, unauthenticated by necessity
        # (a browser can't do an interactive login before sending telemetry).
        # Must come before the "/" catch-all below -- Istio matches http
        # routes in listed order, first match wins. Alloy's faro.receiver
        # hardcodes its listen path to "/collect" (not configurable), so the
        # "/faro" prefix is stripped via rewrite before forwarding.
        - path: /faro
          pathType: Prefix
          serviceName: alloy-faro
          servicePort: 12347
          # Istio's own validation (validateURIRegexRewrite in
          # pkg/config/validation/validation.go) requires BOTH Match and
          # Rewrite to be non-empty strings -- rewrite.uri: "" is rejected as
          # unset, and uriRegexRewrite.rewrite: "" is rejected outright
          # ("UriRegexRewrite requires both Rewrite and Match fields to be
          # specified"). Can't just replace the matched prefix with nothing;
          # capture everything after "/faro" and rewrite to just that group
          # instead, e.g. "/faro/collect" -> "/collect".
          rewriteRegex:
            match: "^/faro(/.*)$"
            rewrite: '\1'
istio:
  enabled: true
  namespace: istio-system
  gatewayName: central-gateway
  gatewayRef: istio-system/central-gateway
  hosts:
    # Wildcard covers all tenant subdomains: admin-acme, agent-acme, etc.
    - "*.dalaillama.in"
    # Explicit hosts kept for clarity (also matched by wildcard)
    - auth.dalaillama.in
    - api.dalaillama.in
    - platform.dalaillama.in
    - dashboard.dalaillama.in
    - media.dalaillama.in
    - console.dalaillama.in
    - monitor.dalaillama.in
  tls:
    enabled: true
    httpsRedirect: true
    clusterIssuer: letsencrypt-prod
    certificates:
      # Wildcard cert — covers ALL *.dalaillama.in tenant subdomains
      # Requires DNS-01 challenge (Let's Encrypt doesn't do HTTP-01 for wildcards)
      - secretName: wildcard-dalaillama-in-tls
        hosts:
          - "*.dalaillama.in"
          - dalaillama.in
      # Individual certs kept as fallback (Istio picks most specific match)
      - secretName: auth-dalaillama-in-tls
        hosts:
          - auth.dalaillama.in
      - secretName: api-dalaillama-in-tls
        hosts:
          - api.dalaillama.in
      - secretName: platform-dalaillama-in-tls
        hosts:
          - platform.dalaillama.in
      - secretName: dashboard-dalaillama-in-tls
        hosts:
          - dashboard.dalaillama.in
      - secretName: media-dalaillama-in-tls
        hosts:
          - media.dalaillama.in
      - secretName: console-dalaillama-in-tls
        hosts:
          - console.dalaillama.in
      - secretName: monitor-dalaillama-in-tls
        hosts:
          - monitor.dalaillama.in

# ops.dalaillama.in and the per-tool subdomains: the ops gateways, certificates and
# VirtualServices (templates/ops-dashboard.yaml, ops-tools.yaml) and the oauth2-proxy gate in
# front of them (templates/ops-auth.yaml) -- one flag, because routing and its gate ship together.
opsDashboard:
  enabled: true

# The ClusterIssuer (templates/cluster-issuer.yaml). bootstrap-cloud.sh overrides the email with
# ACME_EMAIL and the zone with DOMAIN; the Cloudflare token Secret it references is created by
# bootstrap, never stored here.
clusterIssuer:
  create: true
  dns01:
    email: admin@dalaillama.in
    zone: dalaillama.in
