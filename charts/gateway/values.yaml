ingress:
  enabled: false
  className: traefik
  annotations: {}
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

  services:

    keycloak:
      enabled: true
      namespace: apps
      host: auth.dalaillama.in
      serviceName: keycloak
      servicePort: 80
      tlsSecretName: auth-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    tenant:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: tenant-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/tenants
          pathType: Prefix

    billing:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: billing-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/billing
          pathType: Prefix

    product:
      enabled: true
      namespace: apps
      host: api.dalaillama.in
      serviceName: product-service
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/products
          pathType: Prefix

    pbx:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: pbx-core
      servicePort: 8080
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/pbx
          pathType: Prefix

    ai:
      enabled: false
      namespace: apps
      host: api.dalaillama.in
      serviceName: ai-service
      servicePort: 8601
      tlsSecretName: api-dalaillama-in-tls

      paths:
        - path: /api/v1/ai
          pathType: Prefix

    minio-api:
      enabled: true
      namespace: infra
      host: media.dalaillama.in
      serviceName: minio
      servicePort: 9000
      tlsSecretName: media-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix

    minio-console:
      enabled: true
      namespace: infra
      host: console.dalaillama.in
      serviceName: minio
      servicePort: 9001
      tlsSecretName: console-dalaillama-in-tls

      paths:
        - path: /
          pathType: Prefix      
istio:
  enabled: true
  namespace: istio-system
  gatewayName: central-gateway
  gatewayRef: istio-system/central-gateway
  hosts:
    - auth.dalaillama.in
    - api.dalaillama.in
    - platform.dalaillama.in
    - dashboard.dalaillama.in
    - media.dalaillama.in
    - console.dalaillama.in
  tls:
    enabled: true
    httpsRedirect: true
    clusterIssuer: letsencrypt-prod
    certificates:
      - secretName: auth-dalaillama-in-tls
        hosts:
          - auth.dalaillama.in
      - secretName: api-dalaillama-in-tls
        hosts:
          - api.dalaillama.in
      - secretName: platform-dalaillama-in-tls
        hosts:
          - platform.dalaillama.in
      - secretName: dashboard-dalaillama-in-tls
        hosts:
          - dashboard.dalaillama.in
      - secretName: media-dalaillama-in-tls
        hosts:
          - media.dalaillama.in
      - secretName: console-dalaillama-in-tls
        hosts:
          - console.dalaillama.in
