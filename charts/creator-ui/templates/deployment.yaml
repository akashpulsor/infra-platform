apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-ui
  labels:
    app: creator-ui
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: creator-ui
  template:
    metadata:
      labels:
        app: creator-ui
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: creator-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - containerPort: 80
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.env.KEYCLOAK_URL | quote }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ .Values.env.KEYCLOAK_SERVER_URL | quote }}
            - name: KEYCLOAK_PROFILE
              value: {{ .Values.env.KEYCLOAK_PROFILE | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.env.KEYCLOAK_REALM | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.env.KEYCLOAK_CLIENT_ID | quote }}
            - name: PLATFORM_URL
              value: {{ .Values.env.PLATFORM_URL | quote }}
            - name: CREATOR_APP_URL
              value: {{ .Values.env.CREATOR_APP_URL | quote }}
            - name: API_BASE_URL
              value: {{ .Values.env.API_BASE_URL | quote }}
            - name: GA_MEASUREMENT_ID
              value: {{ .Values.env.GA_MEASUREMENT_ID | quote }}
            - name: FARO_COLLECTOR_URL
              value: {{ .Values.env.FARO_COLLECTOR_URL | quote }}
            {{- if .Values.razorpay.enabled }}
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.razorpay.existingSecret | quote }}
                  key: {{ .Values.razorpay.keyIdKey | quote }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
