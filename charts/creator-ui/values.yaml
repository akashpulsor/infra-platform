image:
  repository: akashtripathi/creator-ui
  tag: 0.1.360-wallet-checkbox
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  port: 80
istio:
  enabled: true
  host: creator.dalaillama.in
  gatewayName: istio-system/central-gateway
  pathPrefix: /
keycloak:
  issuerUrl: "https://auth.dalaillama.in/realms/dalai-llama"
  jwksUri: "https://auth.dalaillama.in/realms/dalai-llama/protocol/openid-connect/certs"
env:
  KEYCLOAK_URL: "https://auth.dalaillama.in"
  KEYCLOAK_SERVER_URL: "https://auth.dalaillama.in"
  KEYCLOAK_PROFILE: "server"
  KEYCLOAK_REALM: "dalai-llama"
  KEYCLOAK_CLIENT_ID: "creator-ui"
  PLATFORM_URL: "https://platform.dalaillama.in"
  CREATOR_APP_URL: "https://creator.dalaillama.in"
  API_BASE_URL: "https://api.dalaillama.in/api/v1"
  GA_MEASUREMENT_ID: "G-YVWC0J9JC3"
  # Grafana Faro (browser RUM) receiver -- see alloy-faro-receiver.yaml and
  # apps/creator-ui/src/faro.js. Traces + web vitals only for now (no Loki
  # deployed yet, so JS-error/console-log capture has nowhere to go).
  FARO_COLLECTOR_URL: "https://monitor.dalaillama.in/faro/collect"
  # PostHog Cloud (US region) — session replay + product analytics for ops
  # visibility. Free tier: 1M events + 5k session recordings per month, which a
  # single-client platform will not come close to. Leave POSTHOG_API_KEY unset
  # in a dev deploy to no-op the SDK. POSTHOG_DISABLE_RECORDING=true keeps
  # events flowing but stops replays (use if a client asks for data-minimisation).
  POSTHOG_API_KEY: ""
  POSTHOG_HOST: "https://us.i.posthog.com"
  POSTHOG_DISABLE_RECORDING: ""
# The browser only needs Razorpay's public key ID. The private key and webhook
# secret stay exclusively on billing-service.
razorpay:
  enabled: true
  existingSecret: dalai-backend-razorpay
  keyIdKey: key-id
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
