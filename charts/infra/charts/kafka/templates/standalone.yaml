{{- if and .Values.enabled (eq .Values.mode "standalone") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init-scripts
  labels:
    app: kafka
data:
  create-topics.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "Waiting for Kafka to be ready..."
    KAFKA_TOPICS="/opt/kafka/bin/kafka-topics.sh"
    if [[ ! -x "$KAFKA_TOPICS" ]]; then
      echo "Kafka topic CLI not found or not executable at $KAFKA_TOPICS" >&2
      exit 1
    fi

    for attempt in $(seq 1 60); do
      if "$KAFKA_TOPICS" --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
        break
      fi
      echo "Kafka is not ready yet (attempt $attempt/60)"
      sleep 5
    done

    "$KAFKA_TOPICS" --bootstrap-server localhost:9092 --list >/dev/null
    existing_topics="$("$KAFKA_TOPICS" --bootstrap-server localhost:9092 --list)"

    {{- range .Values.topics }}
    if grep -Fxq "{{ .name }}" <<< "$existing_topics"; then
      echo "Topic already exists: {{ .name }}"
    else
      echo "Creating topic: {{ .name }}"
      "$KAFKA_TOPICS" --bootstrap-server localhost:9092 \
        --create --if-not-exists \
        --topic {{ .name }} \
        --partitions {{ .partitions }} \
        --replication-factor {{ .replicationFactor }}
      existing_topics="$(printf '%s\n%s' "$existing_topics" "{{ .name }}")"
    fi
    {{- end }}

    echo "All topics created successfully"

    # Keep container running
    tail -f /dev/null
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  labels:
    app: kafka
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        sidecar.istio.io/inject: "false"
        checksum/topic-script: "v3-skip-existing"
        checksum/topics: {{ toYaml .Values.topics | sha256sum | quote }}
        # Exclude Kafka ports from Istio mTLS - TCP protocols don't work well with mTLS
        traffic.sidecar.istio.io/excludeInboundPorts: "9092,9093"
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: CLUSTER_ID
              value: {{ .Values.kraft.clusterId | quote }}
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 5
        # Topic creation sidecar
        - name: topic-creator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - /scripts/create-topics.sh
          volumeMounts:
            - name: init-scripts
              mountPath: /scripts
          resources:
            {{- toYaml .Values.topicCreator.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
        - name: init-scripts
          configMap:
            name: kafka-init-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  type: {{ if .Values.global.localDev.exposeInfraLoadBalancer }}LoadBalancer{{ else }}{{ .Values.service.type }}{{ end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: kafka
      name: kafka
    - port: {{ .Values.service.controllerPort }}
      targetPort: controller
      name: controller
  selector:
    app: kafka
{{- end }}
