global:
  namespace: infra

# =============================================================================
# INFRASTRUCTURE - LOCAL SUBCHARTS
# =============================================================================
postgres:
  enabled: true
  mode: standalone
  auth:
    postgresPassword: "postgres123"
    database: dalaillama
  users:
    - username: tenant_user
      password: ""
      database: tenant_db
    - username: product_user
      password: ""
      database: product_db
    - username: billing_user
      password: ""
      database: billing_db
    - username: pbx_user
      password: ""
      database: pbx_db
    - username: ai_user
      password: ""
      database: ai_db
    - username: keycloak
      password: ""
      database: keycloak_db
  databases:
    - tenant_db
    - product_db
    - billing_db
    - pbx_db
    - ai_db
    - keycloak_db

  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  mode: standalone
  auth:
    enabled: true
    password: "redis123"
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kafka:
  enabled: true
  mode: standalone
  kraft:
    clusterId: "MkU3OEVBNTcwNTJENDM2Qk"
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  topics:
    - name: tenant.state.changed
      partitions: 3
      replicationFactor: 1
    - name: tenant.created
      partitions: 3
      replicationFactor: 1
    - name: tenant.deleted
      partitions: 3
      replicationFactor: 1
    - name: tenant.activated
      partitions: 3
      replicationFactor: 1
    - name: tenant.suspended
      partitions: 3
      replicationFactor: 1
    - name: product.plan.assigned
      partitions: 3
      replicationFactor: 1
    - name: product.plan.changed
      partitions: 3
      replicationFactor: 1
    - name: product.did.purchased
      partitions: 3
      replicationFactor: 1
    - name: product.did.provisioned
      partitions: 3
      replicationFactor: 1
    - name: product.did.released
      partitions: 3
      replicationFactor: 1
    - name: billing.wallet.created
      partitions: 3
      replicationFactor: 1
    - name: billing.wallet.funded
      partitions: 3
      replicationFactor: 1
    - name: billing.wallet.low
      partitions: 3
      replicationFactor: 1
    - name: billing.state.changed
      partitions: 3
      replicationFactor: 1
    - name: billing.payment.received
      partitions: 3
      replicationFactor: 1
    - name: billing.cdr.rated
      partitions: 3
      replicationFactor: 1
    - name: cdr.completed
      partitions: 10
      replicationFactor: 1
    - name: provisioning.step.completed
      partitions: 3
      replicationFactor: 1
    - name: provisioning.failed
      partitions: 3
      replicationFactor: 1
    # ── PBX-Core → billing-service ──
    - name: call.billing
      partitions: 10
      replicationFactor: 1
    - name: call.cdr
      partitions: 10
      replicationFactor: 1
    # ── Kamailio / FreeSWITCH → agent-service ──
    - name: pbx-registration-events
      partitions: 3
      replicationFactor: 1
    - name: pbx-call-events
      partitions: 10
      replicationFactor: 1
    # ── AI pipeline ──
    - name: rtp-voice-frames
      partitions: 10
      replicationFactor: 1
    - name: ai-transcript-results
      partitions: 10
      replicationFactor: 1
    # ── Agent-service ──
    - name: agent.assign.requests
      partitions: 3
      replicationFactor: 1
    - name: agent.assign.responses
      partitions: 3
      replicationFactor: 1
    # ── Billing-service (produced) ──
    - name: billing.subscription.activated
      partitions: 3
      replicationFactor: 1
    # ── Product-service → tenant-service ──
    - name: product.subscription.activated
      partitions: 3
      replicationFactor: 1

# =============================================================================
# MINIO - Object Storage (call recordings, voicemail, exports)
# =============================================================================
minio:
  enabled: true
  mode: standalone
  image:
    repository: quay.io/minio/minio
    tag: "RELEASE.2025-06-13T11-33-47Z"
    pullPolicy: IfNotPresent
  mcImage:
    repository: quay.io/minio/mc
    tag: "RELEASE.2025-08-13T08-35-41Z"
    pullPolicy: IfNotPresent
  auth:
    existingSecretName: minio-secret

  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  defaultBuckets: "call-recordings,voicemail,campaign-exports,bot-knowledge,cdr-archives"
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001
  ingress:
    enabled: false
  # PBX-Core connects via: http://minio.infra.svc.cluster.local:9000
  # Console accessible via: kubectl port-forward svc/minio 9001:9001 -n infra

# =============================================================================
# SECRETS REFERENCES
# =============================================================================
secrets:
  postgres:
    name: postgres-secret
    passwordKey: postgres-password
  redis:
    name: redis-secret
    passwordKey: redis-password
  keycloak:
    name: dalai-backend-keycloak
    clientSecretKey: client-secret
    adminPasswordKey: admin-password

  minio:
    name: minio-secret
    rootUserKey: minio-root-user
    rootPasswordKey: minio-root-password
# =============================================================================
# RBAC
# =============================================================================
clusterRole:
  create: true

rbac:
  create: true

serviceAccount:
  create: true
