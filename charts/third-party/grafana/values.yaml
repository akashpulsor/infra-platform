# Istio 1.27.2's samples/addons/values-grafana.yaml, plus this platform's datasource and ops settings.
# The dashboards ConfigMaps it mounts come from the observability-config chart.
# Avoid creating a bunch of RBAC rules for features we are not enabling
rbac:
  create: false
  pspEnabled: false

# Disable test pods
testFramework:
  enabled: false

podLabels:
  sidecar.istio.io/inject: "false"

# Demo only, so we will have no authentication
admin:
  existingSecret: ""
ldap:
  existingSecret: true
env:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "admin"
  GF_AUTH_BASIC_ENABLED: "false"
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  # Editor, as grafana.ini says: environment variables override grafana.ini, so Istio's demo default
  # (Admin) here silently won over the ops config.
  GF_AUTH_ANONYMOUS_ORG_ROLE: Editor

# Expose on port 3000 to match the Istio docs
service:
  port: 3000

securityContext: null

# Set up out dashboards
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "istio"
        orgId: 1
        folder: "istio"
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/istio
      - name: "istio-services"
        orgId: 1
        folder: "istio-services"
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/istio-services

dashboardsConfigMaps:
  istio: "istio-grafana-dashboards"
  istio-services: "istio-services-grafana-dashboards"

# Configure the prometheus data source. We expect prometheus:9090 in the same namespace
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        orgId: 1
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s
        editable: true
      - name: Loki
        type: loki
        uid: loki
        orgId: 1
        url: http://loki.istio-system.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: 5s
          maxLines: 5000
        editable: true

# Served at https://grafana.dalaillama.in/ (its own host, at the root) behind oauth2-proxy: login is
# the proxy's job, Grafana trusts its X-Auth-Request-* headers. root_url must be that host --
# Grafana builds its redirects from it, and the old ops.dalaillama.in/grafana sub-path value sent
# every visitor to a route that stripped the prefix Grafana expected, so it never rendered.
# ops.dalaillama.in/grafana now just redirects here (gateway chart, ops-dashboard.yaml).
grafana.ini:
  analytics:
    check_for_updates: false
  grafana_net: null
  server:
    domain: grafana.dalaillama.in
    root_url: "https://grafana.dalaillama.in/"
    serve_from_sub_path: false
  auth:
    disable_login_form: true
  auth.anonymous:
    enabled: true
    org_role: Editor
    hide_version: true
  auth.proxy:
    enabled: true
    header_name: X-Auth-Request-Email
    header_property: username
    auto_sign_up: true
    headers: "Email:X-Auth-Request-Email Name:X-Auth-Request-User"
    enable_login_token: false
  users:
    allow_sign_up: false
    default_theme: dark
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/istio-services/istio-mesh-dashboard.json
  security:
    allow_embedding: true
    cookie_samesite: lax
