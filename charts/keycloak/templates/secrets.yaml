# =============================================================================
# KEYCLOAK SECRETS
# Manages administrative, database, and client-level credentials
# =============================================================================
{{- $adminSecretName := "keycloak-admin-secret" -}}
{{- $dbSecretName := "keycloak-db-secret" -}}
{{- $clientSecretName := "keycloak-client-secret" -}}
{{- $existingAdminSecret := lookup "v1" "Secret" .Release.Namespace $adminSecretName -}}
{{- $existingDbSecret := lookup "v1" "Secret" .Release.Namespace $dbSecretName -}}
{{- $existingClientSecret := lookup "v1" "Secret" .Release.Namespace $clientSecretName -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: keycloak
type: Opaque
stringData:
  # Used for initial admin login
  password: {{ .Values.auth.adminPassword | default (and $existingAdminSecret (index $existingAdminSecret.data "password" | b64dec)) | quote }}

---

{{- if .Values.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: keycloak
type: Opaque
stringData:
  # Credentials for Keycloak to connect to Postgres
  username: {{ .Values.database.username | default (and $existingDbSecret (index $existingDbSecret.data "username" | b64dec)) | quote }}
  password: {{ .Values.database.password | default (and $existingDbSecret (index $existingDbSecret.data "password" | b64dec)) | quote }}
{{- end }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: keycloak
type: Opaque
stringData:
  # This is the secret that will be injected into your client.json 
  # via the PLATFORM_API_SECRET environment variable
  client-secret: {{ .Values.keycloak.clientSecret | default (and $existingClientSecret (index $existingClientSecret.data "client-secret" | b64dec)) | quote }}
