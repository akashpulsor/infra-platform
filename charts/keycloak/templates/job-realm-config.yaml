# =============================================================================
# REALM CONFIG JOB
# Applies realm-level settings (e.g. include 'sub' claim in access tokens).
# Runs on every install/upgrade via Helm hook to ensure idempotent config.
# Uses curl + Keycloak Admin REST API (no heavy Keycloak image needed).
# =============================================================================
{{- if .Values.jobs.realmConfig.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  labels:
    app: keycloak
    job: realm-config
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.jobs.realmConfig.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.jobs.realmConfig.backoffLimit }}
  template:
    metadata:
      annotations:
        {{- if and .Values.istio.enabled .Values.istio.excludeOutboundPorts }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.istio.excludeOutboundPorts | quote }}
        {{- end }}
        sidecar.istio.io/inject: "false"
      labels:
        app: keycloak
        job: realm-config
    spec:
      restartPolicy: OnFailure
      {{- if .Values.jobs.realmConfig.waitForKeycloak }}
      initContainers:
        - name: wait-for-keycloak
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak to be ready..."
              until curl -sf http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.managementPort }}/health/ready; do
                echo "Keycloak not ready yet, waiting..."
                sleep 10
              done
              echo "Keycloak is ready!"
      {{- end }}
      containers:
        - name: realm-config
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              KEYCLOAK_URL="http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.servicePort }}"
              REALM="{{ .Values.keycloak.realmName }}"

              echo "=== Get admin token ==="
              RESP=$(curl -s -X POST \
                "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=$KEYCLOAK_ADMIN" \
                -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                -d "grant_type=password" \
                -d "client_id=admin-cli")
              TOKEN=$(echo "$RESP" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to get admin token. Response: $RESP"
                exit 1
              fi
              echo "Got admin token."

              echo "=== Step 1: Find basic scope and update sub mapper ==="
              # Get basic scope ID — grep for "name":"basic" with adjacent "id"
              SCOPES=$(curl -s "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes" \
                -H "Authorization: Bearer $TOKEN")
              BASIC_ID=$(echo "$SCOPES" | grep -o '"id":"[^"]*","name":"basic"' | head -1 | cut -d'"' -f4)
              echo "Basic scope: $BASIC_ID"

              if [ -z "$BASIC_ID" ]; then
                echo "ERROR: basic scope not found"
                exit 1
              fi

              # Find existing sub mapper by matching id adjacent to name:"sub"
              MAPPERS=$(curl -s "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes/$BASIC_ID/protocol-mappers/models" \
                -H "Authorization: Bearer $TOKEN")
              SUB_ID=$(echo "$MAPPERS" | grep -o '"id":"[^"]*","name":"sub"' | head -1 | cut -d'"' -f4)
              echo "Existing sub mapper: $SUB_ID"

              if [ -n "$SUB_ID" ]; then
                echo "Updating sub mapper with lightweight support..."
                HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                  "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes/$BASIC_ID/protocol-mappers/models/$SUB_ID" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"$SUB_ID\",\"name\":\"sub\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-sub-mapper\",\"config\":{\"access.token.claim\":\"true\",\"id.token.claim\":\"true\",\"introspection.token.claim\":\"true\",\"lightweight.claim.access.token\":\"true\"}}")
                echo "Update mapper: HTTP $HTTP"
              else
                echo "Creating sub mapper..."
                HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                  "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes/$BASIC_ID/protocol-mappers/models" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"name":"sub","protocol":"openid-connect","protocolMapper":"oidc-sub-mapper","config":{"access.token.claim":"true","id.token.claim":"true","introspection.token.claim":"true","lightweight.claim.access.token":"true"}}')
                echo "Create mapper: HTTP $HTTP"
              fi

              echo "=== Done ==="
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.auth.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: password
{{- end }}
