# =============================================================================
# REALM CONFIG JOB
# Applies realm-level settings (e.g. include 'sub' claim in access tokens).
# Runs on every install/upgrade via Helm hook to ensure idempotent config.
# Uses curl + Keycloak Admin REST API (no heavy Keycloak image needed).
# =============================================================================
{{- if .Values.jobs.realmConfig.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  labels:
    app: keycloak
    job: realm-config
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.jobs.realmConfig.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.jobs.realmConfig.backoffLimit }}
  template:
    metadata:
      annotations:
        {{- if and .Values.istio.enabled .Values.istio.excludeOutboundPorts }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.istio.excludeOutboundPorts | quote }}
        {{- end }}
        sidecar.istio.io/inject: "false"
      labels:
        app: keycloak
        job: realm-config
    spec:
      restartPolicy: OnFailure
      {{- if .Values.jobs.realmConfig.waitForKeycloak }}
      initContainers:
        - name: wait-for-keycloak
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak to be ready..."
              until curl -sf http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.managementPort }}/health/ready; do
                echo "Keycloak not ready yet, waiting..."
                sleep 10
              done
              echo "Keycloak is ready!"
      {{- end }}
      containers:
        - name: realm-config
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              KEYCLOAK_URL="http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.servicePort }}"
              REALM="{{ .Values.keycloak.realmName }}"

              echo "=== Step 0: Get admin token ==="
              RESP=$(curl -s -X POST \
                "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=$KEYCLOAK_ADMIN" \
                -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                -d "grant_type=password" \
                -d "client_id=admin-cli")
              TOKEN=$(echo "$RESP" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to get admin token. Response: $RESP"
                exit 1
              fi
              echo "Got admin token."

              echo "=== Step 1: Find basic scope UUID ==="
              SCOPES=$(curl -s \
                "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes" \
                -H "Authorization: Bearer $TOKEN")
              # Extract UUID for the scope named "basic"
              BASIC_ID=$(echo "$SCOPES" | tr ',' '\n' | grep -B5 '"name":"basic"' | grep '"id"' | head -1 | grep -o '"id":"[^"]*' | cut -d'"' -f4)
              echo "Basic scope UUID: $BASIC_ID"

              if [ -n "$BASIC_ID" ]; then
                echo "=== Step 1b: Add sub mapper to basic scope ==="
                HTTP_CODE=$(curl -s -w "\n%{http_code}" -X POST \
                  "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes/$BASIC_ID/protocol-mappers/add-models" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '[{
                    "name": "sub",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-sub-mapper",
                    "config": {
                      "access.token.claim": "true",
                      "id.token.claim": "true",
                      "introspection.token.claim": "true",
                      "lightweight.claim.access.token": "true"
                    }
                  }]')
                echo "Add-models response: $HTTP_CODE"
              else
                echo "WARNING: basic scope not found"
              fi

              echo "=== Step 2: Disable lightweight tokens on dashboard-ui ==="
              # Get the dashboard-ui client UUID
              CLIENT_RESP=$(curl -s \
                "$KEYCLOAK_URL/admin/realms/$REALM/clients?clientId=dashboard-ui" \
                -H "Authorization: Bearer $TOKEN")
              echo "Client lookup: $CLIENT_RESP" | head -c 200
              echo ""

              CLIENT_UUID=$(echo "$CLIENT_RESP" | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)

              if [ -n "$CLIENT_UUID" ]; then
                echo "Found dashboard-ui (uuid=$CLIENT_UUID). Fetching full client..."
                CLIENT_FULL=$(curl -s \
                  "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_UUID" \
                  -H "Authorization: Bearer $TOKEN")

                # Update: set access.token.lightweight.claim to false
                UPDATED=$(echo "$CLIENT_FULL" | sed 's/"access.token.lightweight.claim":"true"/"access.token.lightweight.claim":"false"/g')

                # If the attribute doesn't exist yet, inject it into attributes
                if echo "$UPDATED" | grep -q '"access.token.lightweight.claim"'; then
                  echo "Attribute exists, updating..."
                else
                  echo "Attribute not found, injecting..."
                  UPDATED=$(echo "$UPDATED" | sed 's/"attributes":{/"attributes":{"access.token.lightweight.claim":"false",/g')
                fi

                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                  "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_UUID" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$UPDATED")
                echo "Client update response: HTTP $HTTP_CODE"
              else
                echo "WARNING: dashboard-ui client not found"
              fi

              echo "=== Done ==="
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.auth.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: password
{{- end }}
