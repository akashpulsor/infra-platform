# =============================================================================
# REALM CONFIG JOB
# Applies realm-level settings (e.g. include 'sub' claim in access tokens).
# Runs on every install/upgrade via Helm hook to ensure idempotent config.
# Uses curl + Keycloak Admin REST API (no heavy Keycloak image needed).
# =============================================================================
{{- if .Values.jobs.realmConfig.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  labels:
    app: keycloak
    job: realm-config
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.jobs.realmConfig.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.jobs.realmConfig.backoffLimit }}
  template:
    metadata:
      annotations:
        {{- if and .Values.istio.enabled .Values.istio.excludeOutboundPorts }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.istio.excludeOutboundPorts | quote }}
        {{- end }}
        sidecar.istio.io/inject: "false"
      labels:
        app: keycloak
        job: realm-config
    spec:
      restartPolicy: OnFailure
      {{- if .Values.jobs.realmConfig.waitForKeycloak }}
      initContainers:
        - name: wait-for-keycloak
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak to be ready..."
              until curl -sf http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.managementPort }}/health/ready; do
                echo "Keycloak not ready yet, waiting..."
                sleep 10
              done
              echo "Keycloak is ready!"
      {{- end }}
      containers:
        - name: realm-config
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              set -e
              KEYCLOAK_URL="http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.servicePort }}"
              REALM="{{ .Values.keycloak.realmName }}"

              echo "Getting admin token..."
              TOKEN=$(curl -sf -X POST \
                "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=$KEYCLOAK_ADMIN" \
                -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to get admin token"
                exit 1
              fi
              echo "Got admin token."

              # ── Step 1: Add 'sub' protocol mapper to a default client scope ──
              # In Keycloak 24+, 'sub' is NOT in the access token by default.
              # We need an oidc-sub-mapper on a default scope so all clients get it.
              echo "Looking up default client scopes..."
              SCOPES=$(curl -sf \
                "$KEYCLOAK_URL/admin/realms/$REALM/default-default-client-scopes" \
                -H "Authorization: Bearer $TOKEN")

              # Find the 'basic' scope (ships with Keycloak, always default)
              BASIC_SCOPE_ID=$(echo "$SCOPES" | grep -o '"id":"[^"]*","name":"basic"' | grep -o '"id":"[^"]*' | cut -d'"' -f4)

              if [ -z "$BASIC_SCOPE_ID" ]; then
                # Fallback: try 'roles' scope
                BASIC_SCOPE_ID=$(echo "$SCOPES" | grep -o '"id":"[^"]*","name":"roles"' | grep -o '"id":"[^"]*' | cut -d'"' -f4)
                SCOPE_NAME="roles"
              else
                SCOPE_NAME="basic"
              fi

              if [ -z "$BASIC_SCOPE_ID" ]; then
                echo "ERROR: Could not find a default client scope (basic or roles)"
                exit 1
              fi
              echo "Found default scope '$SCOPE_NAME' (id=$BASIC_SCOPE_ID)"

              # ── Step 1: Upsert 'sub' mapper on default scope with lightweight support ──
              echo "Checking existing protocol mappers on '$SCOPE_NAME' scope..."
              MAPPERS=$(curl -sf \
                "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes/$BASIC_SCOPE_ID/protocol-mappers/models" \
                -H "Authorization: Bearer $TOKEN")

              # Find existing sub mapper ID
              SUB_MAPPER_ID=$(echo "$MAPPERS" | grep -o '"id":"[^"]*","name":"[^"]*","protocol":"openid-connect","protocolMapper":"oidc-sub-mapper"' | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)

              SUB_MAPPER_CONFIG='{
                "access.token.claim": "true",
                "id.token.claim": "true",
                "introspection.token.claim": "true",
                "lightweight.claim.access.token": "true"
              }'

              if [ -n "$SUB_MAPPER_ID" ]; then
                echo "Found existing sub mapper (id=$SUB_MAPPER_ID) — updating with lightweight support..."
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                  "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes/$BASIC_SCOPE_ID/protocol-mappers/models/$SUB_MAPPER_ID" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"id\": \"$SUB_MAPPER_ID\",
                    \"name\": \"subject (sub)\",
                    \"protocol\": \"openid-connect\",
                    \"protocolMapper\": \"oidc-sub-mapper\",
                    \"config\": {
                      \"access.token.claim\": \"true\",
                      \"id.token.claim\": \"true\",
                      \"introspection.token.claim\": \"true\",
                      \"lightweight.claim.access.token\": \"true\"
                    }
                  }")
                echo "Update sub mapper response: HTTP $HTTP_CODE"
              else
                echo "No existing sub mapper found — creating with lightweight support..."
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                  "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes/$BASIC_SCOPE_ID/protocol-mappers/models" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "name": "subject (sub)",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-sub-mapper",
                    "config": {
                      "access.token.claim": "true",
                      "id.token.claim": "true",
                      "introspection.token.claim": "true",
                      "lightweight.claim.access.token": "true"
                    }
                  }')
                echo "Create sub mapper response: HTTP $HTTP_CODE"
              fi

              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
                echo "Sub mapper configured successfully."
              else
                echo "WARNING: Sub mapper response HTTP $HTTP_CODE"
              fi

              # ── Step 2: Disable lightweight access tokens on all public clients ──
              echo "Checking public clients for lightweight access token setting..."
              CLIENTS=$(curl -sf \
                "$KEYCLOAK_URL/admin/realms/$REALM/clients" \
                -H "Authorization: Bearer $TOKEN")

              # Find public clients (publicClient=true) and disable lightweight tokens
              for CLIENT_ID in $(echo "$CLIENTS" | grep -o '"id":"[^"]*","clientId":"[^"]*"[^}]*"publicClient":true' | grep -o '"id":"[^"]*' | cut -d'"' -f4); do
                CLIENT_NAME=$(echo "$CLIENTS" | grep -o "\"id\":\"$CLIENT_ID\",\"clientId\":\"[^\"]*" | grep -o '"clientId":"[^"]*' | cut -d'"' -f4)
                echo "Disabling lightweight access tokens on client '$CLIENT_NAME'..."
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                  "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_ID" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"$CLIENT_ID\",\"clientId\":\"$CLIENT_NAME\",\"attributes\":{\"access.token.lightweight.claim\":\"false\"}}")
                echo "  -> HTTP $HTTP_CODE"
              done

              echo "Realm config applied successfully."
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.auth.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: password
{{- end }}
