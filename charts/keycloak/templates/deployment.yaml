{{- $themeMode := default (ternary "image" "configmap" (ne (default "" .Values.theme.initImage) "")) .Values.theme.mode -}}
{{- $themeName := default "dalaillama" .Values.theme.name -}}
{{- $themeConfigMap := default "keycloak-theme-config" .Values.theme.configMapName -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      annotations:
        {{- if and .Values.istio.enabled .Values.istio.excludeOutboundPorts }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.istio.excludeOutboundPorts | quote }}
        {{- end }}
        {{- if and .Values.theme.enabled (eq $themeMode "configmap") }}
        checksum/theme: {{ include (print $.Template.BasePath "/theme-configmap.yaml") . | sha256sum }}
        {{- end }}
      labels:
        app: keycloak
        sidecar.istio.io/inject: "{{ .Values.istio.enabled | default "false" }}"

    spec:

      {{- if and .Values.theme.enabled (eq $themeMode "image") }}
      initContainers:
        - name: theme-loader
          image: {{ .Values.theme.initImage }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Loading Keycloak theme..."
              cp -r /themes/* /opt/keycloak/themes/
          volumeMounts:
            - name: themes
              mountPath: /opt/keycloak/themes
      {{- end }}

      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - start

          env:

            # ==========================
            # HTTP / Proxy
            # ==========================
            - name: KC_HTTP_ENABLED
              value: "true"

            - name: KC_PROXY_HEADERS
              value: "xforwarded"

            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}

            - name: KC_HOSTNAME_STRICT
              value: "false"

            # ==========================
            # Health / Metrics
            # ==========================
            - name: KC_HEALTH_ENABLED
              value: "true"

            - name: KC_METRICS_ENABLED
              value: "true"

            - name: KC_HTTP_MANAGEMENT_ENABLED
              value: "true"

            {{- if .Values.theme.enabled }}
            # ConfigMap-backed themes should reflect chart changes after rollout.
            - name: KC_SPI_THEME_CACHE_THEMES
              value: "false"

            - name: KC_SPI_THEME_CACHE_TEMPLATES
              value: "false"

            - name: KC_SPI_THEME_STATIC_MAX_AGE
              value: "-1"

            - name: KC_SPI_THEME_DEFAULT
              value: {{ $themeName | quote }}
            {{- end }}

            # ==========================
            # Bootstrap Admin
            # ==========================
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.auth.adminUser | quote }}

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: password

            # ==========================
            # Database
            # ==========================
            - name: KC_DB
              value: {{ .Values.database.vendor }}

            - name: KC_DB_URL_HOST
              value: {{ .Values.database.host }}

            - name: KC_DB_URL_PORT
              value: "{{ .Values.database.port }}"

            - name: KC_DB_URL_DATABASE
              value: {{ .Values.database.name }}

            - name: KC_DB_URL_PROPERTIES
              value: {{ .Values.database.urlProperties | quote }}

            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: password

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

            - name: management
              containerPort: {{ .Values.service.managementPort }}
              protocol: TCP

          # ==========================
          # Startup Probe
          # ==========================
          startupProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.managementPort }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}

          # ==========================
          # Readiness Probe
          # ==========================
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.managementPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          # ==========================
          # Liveness Probe
          # ==========================
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.managementPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.theme.enabled }}
          volumeMounts:
            {{- if eq $themeMode "image" }}
            - name: themes
              mountPath: /opt/keycloak/themes
            {{- else if eq $themeMode "configmap" }}
            - name: themes
              mountPath: /opt/keycloak/themes/{{ $themeName }}
              readOnly: true
            {{- end }}
          {{- end }}

      {{- if .Values.theme.enabled }}
      volumes:
        {{- if eq $themeMode "image" }}
        - name: themes
          emptyDir: {}
        {{- else if eq $themeMode "configmap" }}
        - name: themes
          configMap:
            name: {{ $themeConfigMap }}
            items:
              - key: root-theme.properties
                path: theme.properties
              - key: login-theme.properties
                path: login/theme.properties
              - key: login.css
                path: login/resources/css/login.css
              - key: dalaillama.css
                path: login/resources/css/dalaillama.css
              - key: phone-country-code.js
                path: login/resources/js/phone-country-code.js
              - key: login-messages-en.properties
                path: login/messages/messages_en.properties
              - key: email-theme.properties
                path: email/theme.properties
              - key: email-messages-en.properties
                path: email/messages/messages_en.properties
              - key: email-verification.ftl
                path: email/html/email-verification.ftl
              - key: execute-actions.ftl
                path: email/html/execute-actions.ftl
              - key: password-reset.ftl
                path: email/html/password-reset.ftl
        {{- end }}
      {{- end }}
