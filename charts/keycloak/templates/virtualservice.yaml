{{- if .Values.istio.enabled }}
{{- $destinationRule := .Values.istio.destinationRule | default dict }}
{{- $retries := .Values.istio.retries | default dict }}
# =============================================================================
# VirtualService - Routes traffic to Keycloak
# =============================================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: auth
spec:
  hosts:
    - {{ .Values.istio.host | quote }}
    {{- if .Values.istio.productionHost }}
    - {{ .Values.istio.productionHost | quote }}
    {{- end }}
  gateways:
    - {{ .Values.istio.gatewayName | quote }}
  http:
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-proto: "https"
            x-forwarded-port: "443"
      route:
        - destination:
            host: keycloak.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.servicePort }}
      timeout: 30s
      {{- if $retries.enabled }}
      retries:
        attempts: {{ $retries.attempts | default 3 }}
        perTryTimeout: {{ $retries.perTryTimeout | default "10s" | quote }}
        retryOn: {{ $retries.retryOn | default "connect-failure,refused-stream,unavailable,cancelled,reset" | quote }}
      {{- end }}
---
# =============================================================================
# DestinationRule - Traffic policy for Keycloak
# =============================================================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: auth
spec:
  host: keycloak.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: {{ $destinationRule.tlsMode | default "DISABLE" | quote }}
    connectionPool:
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        maxRequestsPerConnection: 100
      tcp:
        maxConnections: 100
---
# =============================================================================
# PeerAuthentication - mTLS mode for Keycloak
# =============================================================================
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: auth
spec:
  selector:
    matchLabels:
      app: keycloak
  mtls:
    mode: PERMISSIVE
---
# =============================================================================
# AuthorizationPolicy - Keycloak is public (login page must be accessible)
# =============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: keycloak-public
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: auth
spec:
  selector:
    matchLabels:
      app: keycloak
  action: ALLOW
  rules:
    - {}
{{- end }}
