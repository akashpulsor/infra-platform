# =============================================================================
# Pre-create keycloak-client-secret in apps namespace with a placeholder.
# realm-config Job (weight 20) will overwrite the value with the real
# platform-api secret read from Keycloak. Backend services that mount this
# secret will start with the real value.
# =============================================================================
# templates/keycloak-client-secret-init.yaml
{{- if .Values.jobs.realmConfig.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-client-secret
  namespace: {{ .Values.keycloak.appsNamespace | default "apps" }}
  labels:
    app: keycloak
    managed-by: keycloak-realm-config
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  client-secret: "placeholder-overwritten-by-realm-config-job"
{{- end }}