image:
  repository: quay.io/keycloak/keycloak
  tag: "26.0"
  pullPolicy: IfNotPresent

replicaCount: 1

keycloak:
  hostname: ""
  realmName: dalai-llama
  appsNamespace: apps
auth:
  adminUser: admin




theme:
  enabled: false
  initImage: ""

database:
  enabled: true
  vendor: postgres
  host: postgres.infra.svc.cluster.local
  port: 5432
  name: keycloak_db
  # Internal cluster Postgres is not configured for TLS.
  urlProperties: "?sslmode=disable"

service:
  type: ClusterIP
  port: 8080
  managementPort: 9000
  servicePort: 80

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

istio:
  enabled: false
  host: ""
  gatewayName: ""
  excludeOutboundPorts: "5432"

# =============================================================================
# Batch Jobs Configuration
# =============================================================================
jobs:
  # Realm import job - imports realm configuration on first install
  realmImport:
    # Keep disabled for normal upgrades because Kubernetes Jobs are immutable.
    # Enable only for a first-time realm bootstrap or run it manually.
    enabled: false
    # When false, create a normal Job so Helm does not wait on it during install/upgrade.
    useHelmHook: false
    # Run the import hook on upgrades too. Usually not needed because import uses --override=false.
    runOnUpgrade: false
    # ConfigMap containing realm JSON files
    configMapName: keycloak-bootstrap-config
    # Wait for Keycloak to be ready before importing
    waitForKeycloak: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 600

  # User sync job - syncs users from external sources
  userSync:
    enabled: false
    schedule: "0 */6 * * *"  # Every 6 hours
    image: curlimages/curl:latest
    # Custom script ConfigMap
    scriptConfigMap: keycloak-user-sync-script
    backoffLimit: 2
    ttlSecondsAfterFinished: 300

  # Cleanup job - removes expired sessions, tokens
  cleanup:
    enabled: false
    schedule: "0 2 * * *"  # Daily at 2 AM
    backoffLimit: 1
    ttlSecondsAfterFinished: 300

  # Realm config job - applies realm attributes (e.g. include sub in token)
  # Runs on every install/upgrade to ensure realm settings are correct.
  realmConfig:
    enabled: true
    waitForKeycloak: true
    backoffLimit: 5
    ttlSecondsAfterFinished: 600

    # Custom batch job template
  custom:
    enabled: false
    name: keycloak-custom-job
    schedule: ""  # Leave empty for one-time job, set cron for recurring
    image: curlimages/curl:latest
    command: []
    args: []
    env: []
    configMapName: ""
    backoffLimit: 3
    ttlSecondsAfterFinished: 600
  
