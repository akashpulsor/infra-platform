# Overrides the Istio-shipped grafana ConfigMap with ops-dashboard-friendly settings.
#
# What this changes vs the Istio default:
#   - server.root_url / serve_from_sub_path: Grafana serves under /grafana on
#     ops.dalaillama.in (the VirtualService rewrites the URI). Without these two
#     lines every internal link in Grafana points at / and breaks.
#   - auth.proxy: trust oauth2-proxy's X-Auth-Request-Email header so a logged-in
#     Keycloak user is auto-signed-in to Grafana as the same identity. Without
#     this Grafana treats the user as anonymous and username is empty.
#   - auth.anonymous with Editor role: fallback so first-time visitors can still
#     see + poke dashboards even before Grafana's auth.proxy user provisioning
#     kicks in on their first request.
#   - dashboards.default_home_dashboard_path: land on istio-mesh instead of the
#     empty Grafana welcome page.
#   - disable_login_form: no reason to show Grafana's built-in login page when
#     oauth2-proxy is the only entry point.
#
# Kept in a separate ConfigMap-patch manifest (not merged into the Istio addon
# YAML) so re-applying the Istio addon doesn't clobber these settings and vice
# versa. Rerun install-observability.sh to re-apply after any change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: istio-system
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
    ops.dalaillama.in/managed-by: install-observability.sh
data:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = ops.dalaillama.in
    root_url = %(protocol)s://%(domain)s/grafana
    serve_from_sub_path = true
    [auth]
    disable_login_form = true
    [auth.anonymous]
    enabled = true
    org_role = Editor
    hide_version = true
    [auth.proxy]
    enabled = true
    header_name = X-Auth-Request-Email
    header_property = username
    auto_sign_up = true
    headers = Email:X-Auth-Request-Email Name:X-Auth-Request-User
    enable_login_token = false
    [users]
    allow_sign_up = false
    default_theme = dark
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/istio-services/istio-mesh-dashboard.json
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
    - disableDeletion: false
      folder: istio
      name: istio
      options:
        path: /var/lib/grafana/dashboards/istio
      orgId: 1
      type: file
    - disableDeletion: false
      folder: istio-services
      name: istio-services
      options:
        path: /var/lib/grafana/dashboards/istio-services
      orgId: 1
      type: file
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      editable: true
      isDefault: true
      jsonData:
        timeInterval: 15s
      name: Prometheus
      orgId: 1
      type: prometheus
      url: http://prometheus:9090
    - access: proxy
      editable: true
      isDefault: false
      jsonData:
        timeInterval: 5s
        maxLines: 5000
      name: Loki
      orgId: 1
      type: loki
      uid: loki
      url: http://loki.istio-system.svc.cluster.local:3100
