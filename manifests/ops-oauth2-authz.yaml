# Istio-native external authorization gate for ops.dalaillama.in.
#
# Uses Istio's AuthorizationPolicy with action: CUSTOM + a mesh-config-declared
# extensionProvider (oauth2-proxy). This is the officially supported and host-
# scopable way to put an ext-authz check in front of a subset of gateway traffic.
#
# The rule matches ops.dalaillama.in EXCEPT paths under /oauth2/*. Those are
# oauth2-proxy's own paths (the login callback, sign_in, sign_out) and must
# reach it DIRECTLY, not through another ext-authz check. Without the notPaths
# exclusion, oauth2-proxy is asked to authorise its own /oauth2/callback -- it
# sees no session cookie yet (the cookie is only set BY the callback), returns
# 302 to Keycloak, and the browser loops forever. That was the "auth.dalaillama.in
# redirected you too many times" bug on the first launch attempt.
#
# The VirtualService routes /oauth2/* to oauth2-proxy separately; since those
# requests are not matched by this rule, they skip ext-authz and reach oauth2-
# proxy's real handlers where the OAuth flow actually completes.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ops-dashboard-oauth2-proxy
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: CUSTOM
  provider:
    name: oauth2-proxy
  rules:
    - to:
        - operation:
            hosts:
              - ops.dalaillama.in
            notPaths:
              - /oauth2/*
