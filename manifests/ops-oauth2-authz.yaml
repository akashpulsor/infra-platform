# Istio-native external authorization gate for ops.dalaillama.in.
#
# Uses Istio's AuthorizationPolicy with action: CUSTOM + a mesh-config-declared
# extensionProvider. This is the officially supported and host-scopable way to
# put an ext-authz check in front of a subset of gateway traffic. The earlier
# EnvoyFilter approach ran the ext_authz filter on EVERY vhost at the gateway
# HCM level and needed per-vhost DISABLE overrides for every unrelated
# hostname -- fragile, easy to miss a new hostname, and it did break
# auth./api./creator. traffic on the first attempt ("too many redirects").
#
# The extensionProvider is defined in the istio-system/istio ConfigMap under
# meshConfig.extensionProviders[name=oauth2-proxy]. Adding a new one there
# means restarting istiod so it picks up the config. See install-observability.sh.
#
# match.hosts targets ONLY ops.dalaillama.in. Every other hostname served by
# the same ingress gateway is untouched; no per-vhost enumeration required.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ops-dashboard-oauth2-proxy
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: CUSTOM
  provider:
    name: oauth2-proxy
  rules:
    - to:
        - operation:
            hosts:
              - ops.dalaillama.in
